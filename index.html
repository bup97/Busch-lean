<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Busch LEAN">
<meta name="theme-color" content="#0f6e56">
<title>Busch LEAN</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#17202a;--mut:#6b7280;--bd:#e2e5ea;--pri:#0f6e56;--pri2:#e3f2ec;--warn:#d97706;--bad:#c62828;--ok:#15803d;--va:#16a34a;--nva:#f59e0b;--w:#dc2626;--inv:#f6c453}
@media (prefers-color-scheme:dark){:root{--bg:#0f1316;--card:#1a2025;--tx:#e8edf1;--mut:#9aa4ad;--bd:#2c343b;--pri:#3fbf95;--pri2:#163229;--inv:#a87d1f}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--card);border-bottom:1px solid var(--bd)}
header h1{flex:1;margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .logo{font-weight:800;color:var(--pri)}
.brand{display:flex;align-items:center;gap:9px}.brand svg{flex:none;border-radius:8px}
.bt{display:block;font-weight:900;font-size:19px;letter-spacing:.02em;line-height:1}.bt i{font-style:normal;color:#e0a92e;margin:0 1px}
.bs{display:block;font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.06em;line-height:1.2;margin-top:2px}
.back,.info{border:0;background:var(--pri2);color:var(--pri);border-radius:10px;min-width:36px;height:36px;font-size:20px;font-weight:700;cursor:pointer}
.info{font-size:13px;padding:0 10px}
main{max-width:860px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 40px)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 2px 8px}
h3{font-size:15px;margin:14px 0 6px}
.hero h1{font-size:24px;line-height:1.2;margin:6px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.card.link,.proj{cursor:pointer}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gap{gap:8px;justify-content:flex-start;flex-wrap:wrap}
.mut{color:var(--mut)}.sm{font-size:12.5px}
.empty{padding:22px;text-align:center;color:var(--mut);border:1.5px dashed var(--bd);border-radius:14px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;-webkit-appearance:none;appearance:none}
textarea{resize:vertical}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:auto;width:20px!important;height:20px;padding:0;accent-color:var(--pri)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
.row input{flex:1}
label.f{display:block}
label.f span{display:block;font-size:12px;color:var(--mut);margin:0 0 3px 2px}
label.f i{font-style:normal;opacity:.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.full{grid-column:1/-1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.wide{width:100%;margin-top:10px}
.btn.del{color:var(--bad)}
.ib{border:0;background:transparent;color:var(--mut);font-size:16px;padding:4px 7px;cursor:pointer;border-radius:8px}
.ib:hover{background:var(--bg)}
.lnk{border:0;background:none;color:var(--pri);font:inherit;font-weight:600;cursor:pointer;padding:0;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:2px 9px}
.chip.c{color:#fff;border:0}
.pcard{position:relative;background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--pc);border-radius:16px;margin-bottom:14px;cursor:pointer;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07);transition:transform .12s}
.pcard:active{transform:scale(.985)}
.ptop{display:flex;align-items:center;gap:12px;padding:14px 14px 10px;background:linear-gradient(90deg,color-mix(in srgb,var(--pc) 14%,transparent),transparent)}
.pav{width:46px;height:46px;flex:none;border-radius:13px;background:var(--pc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.pname{font-size:19px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgo{font-size:28px;color:var(--pc);font-weight:300}
.pbody{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:2px 14px 10px}
.pm .row{white-space:nowrap;font-size:11.5px;color:var(--mut);margin-bottom:3px}.pm b{color:var(--tx);font-size:12.5px}
.pfoot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 14px 12px}
.pcount{background:var(--pri);color:#fff;border-radius:999px;min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:800;padding:0 10px}
.xl{--bg:#f3f4f6;--card:#fff;--tx:#17202a;--mut:#6b7280;--bd:#e2e5ea;--pri:#0f6e56;--pri2:#e3f2ec;--inv:#f6c453;--bad:#c62828;--ok:#15803d;color:#17202a}
.tl{position:relative;margin-left:14px;border-left:2px solid var(--bd)}
.tli{position:relative;display:flex;gap:8px;align-items:flex-start;padding:4px 0 12px 22px}
.tli>div{flex:1}
.tld{position:absolute;left:-14px;top:2px;width:26px;height:26px;border-radius:50%;background:var(--card);border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:12px}
.tli.plan .tld{border-style:dashed}.tli.late{color:var(--bad)}.tli.late .tld{border-color:var(--bad)}
.tlnow{margin:2px 0 8px;font-size:12px;font-weight:700;color:var(--bad);display:flex;align-items:center;gap:8px}
.tlnow:after{content:'';flex:1;height:2px;background:var(--bad);opacity:.6}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin-top:4px}.leg i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.greif{width:100%;height:auto;display:block;border-radius:10px;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;cursor:crosshair}
.gfl{transform-box:fill-box;transform-origin:center;animation:gfl .45s ease-out forwards}
@keyframes gfl{from{transform:scale(.3);opacity:.9}to{transform:scale(2);opacity:0}}
button.chip{font:inherit;font-size:13px;padding:5px 12px;cursor:pointer;color:var(--tx)}
button.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#printhost{display:none}
@media print{body>*:not(#printhost){display:none!important}#printhost{display:block!important;background:#fff}#printhost *{-webkit-print-color-adjust:exact;print-color-adjust:exact}.ppage+.ppage{break-before:page;page-break-before:always}.ppage svg{display:block}}
.kpat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kst{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;cursor:pointer}
.kst b{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.kst.ok b{background:var(--pri);border-color:var(--pri);color:#fff}
.cdots{display:flex;gap:6px;margin-bottom:12px}.cdots span{flex:1;text-align:center;font-size:12px;font-weight:700;padding:6px 0;border-radius:8px;background:var(--card);border:1px solid var(--bd);color:var(--mut)}
.cdots span.ok{background:var(--pri2);color:var(--pri);border-color:var(--pri2)}.cdots span.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.cq{font-size:22px;font-weight:800;line-height:1.25;margin:6px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tile .ic{font-size:24px}
.seg,.tabs{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px;overflow-x:auto}
.seg button,.tabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:8px 6px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button.on,.tabs button.on{background:var(--pri);color:#fff}
.tabs button.on{background:var(--pri2);color:var(--pri)}
.intro{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--pri2);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.kpi span{display:block;font-size:12px;color:var(--mut)}
.kpi b{font-size:20px}.kpi small{font-size:12px;font-weight:500;color:var(--mut)}
.kpi i{display:block;font-size:11px;font-style:normal;color:var(--mut)}
.live{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;top:57px;z-index:3;background:var(--bg);padding:4px 0 8px}
.live div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 8px;text-align:center}
.live span{display:block;font-size:10.5px;color:var(--mut)}.live b{font-size:15px}
.bar{height:9px;background:var(--bg);border-radius:9px;overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden;border:1px solid var(--bd);margin:6px 0}
.stack i{display:block;height:100%}
.prog{margin:8px 0}.prog .row{font-size:13px;margin-bottom:3px}
.chk{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd)}
.chk:last-child{border:0}
.chk b{width:22px;height:22px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;border:1.5px solid var(--bd);color:var(--mut)}
.chk.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:right}
td:first-child,th:first-child{text-align:left}
th{font-size:12px;color:var(--mut);font-weight:600}
.good{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}
.step h3{margin:0;font-size:15px}
.clock{font:700 46px/1 ui-monospace,Menlo,monospace;text-align:center;padding:16px 0 4px}
.cats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.cats button{border:0;border-radius:14px;padding:18px 6px;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.score{display:flex;gap:4px;margin-top:6px}
.score button{flex:1;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:7px 0;font:inherit;font-weight:700;cursor:pointer}
.score button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.q{padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}.q:last-child{border:0}
.act.done .txt{text-decoration:line-through;opacity:.6}
.st{border:0;border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.st.offen{background:#fde2e1;color:#9b1c1c}.st.arbeit{background:#fef3c7;color:#92400e}.st.erledigt{background:#dcfce7;color:#166534}
.over{color:var(--bad);font-weight:700}
.st.neu{background:#dbeafe;color:#1e40af}.st.pruef{background:#fef3c7;color:#92400e}.st.umgesetzt{background:#dcfce7;color:#166534}.st.abgelehnt{background:#e5e7eb;color:#374151}
.btn.on{background:var(--pri2);color:var(--pri);border-color:var(--pri)}
.quote{border-left:3px solid var(--pri);padding:2px 0 2px 9px;margin:6px 0;font-style:italic;font-size:14px}
.lvl{letter-spacing:1px;color:var(--bad)}
.note{white-space:pre-wrap}
.tip{background:var(--pri2);border-radius:10px;padding:10px;margin-top:10px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px)}
.sheet h2{font-size:19px;text-transform:none;letter-spacing:0;color:var(--tx);margin:0 0 6px}
.sheet ol{padding-left:20px}.sheet li{margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--tx);color:var(--card);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
details summary{cursor:pointer;font-weight:600}
svg text{fill:var(--tx);font-size:10.5px;font-family:inherit}
svg{color:var(--tx)}
svg .b{font-weight:700;font-size:11.5px}
svg .sm{font-size:9.5px;fill:var(--mut)}
.vsm .bx{fill:var(--card);stroke:var(--tx);stroke-width:1.3}
.vsm .bx.bad{stroke:var(--bad);stroke-width:2.4}
.vsm .db{fill:var(--bg);stroke:var(--bd)}
.vsm .tri{fill:var(--inv);stroke:var(--tx);stroke-width:1}
.vsm .info{fill:none;stroke:var(--mut);stroke-dasharray:5 4;stroke-width:1.3}
.vsm .mat{fill:none;stroke:var(--tx);stroke-width:1.6}
.vsm .tl{fill:none;stroke:var(--pri);stroke-width:2}
.vsm .fac{fill:var(--card);stroke:var(--tx);stroke-width:1.3}
.vsm .flow{font-weight:700;font-size:9.5px;fill:var(--pri)}
.vsm .sum{fill:var(--pri2);stroke:var(--pri)}
.chart .bok{fill:var(--pri)}.chart .bbad{fill:var(--bad)}
.chart .takt{stroke:var(--bad);stroke-dasharray:6 4;stroke-width:2}
.chart .tk{fill:var(--bad);font-weight:700}
.chart .ax{stroke:var(--bd)}
.fish .spine{stroke:var(--tx);stroke-width:3}
.fish .bone{stroke:var(--tx);stroke-width:1.6}
.fish .twig{stroke:var(--mut)}
.fish .head{fill:var(--pri2);stroke:var(--pri);stroke-width:1.5}
.fish .cat{font-weight:700;font-size:12.5px;fill:var(--pri)}
.fish .cz{font-size:9.5px}.fish .mainc{font-size:9.5px;font-weight:700;fill:var(--bad)}
.radar .rg{fill:none;stroke:var(--bd)}
.radar .rv{fill:rgba(15,110,86,.25);stroke:var(--pri);stroke-width:2}
.radar text{font-size:10px}
.spag{background:var(--card);border-radius:10px;touch-action:manipulation;width:100%;height:auto;display:block}
.spag .gl{stroke:var(--bd);stroke-width:.6}
.spag .path{fill:none;stroke:var(--w);stroke-width:2;stroke-linejoin:round;opacity:.85}
.spag .sta{fill:var(--pri2);stroke:var(--pri)}
.zone text{font-size:11px;font-weight:700}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="app"></main>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeM()"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>
<script>
/* ===== Grundlagen ===== */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:NaN};
const has=v=>v!==''&&v!=null&&isFinite(num(v));
const fmt=(n,d=1)=>isFinite(n)?n.toLocaleString('de-DE',{maximumFractionDigits:d}):'–';
const trunc=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s};
const today=()=>new Date().toISOString().slice(0,10);
const fmtT=s=>{const m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+(s%60).toFixed(1).padStart(4,'0')};
const pct=(a,b)=>b?a/b*100:0;
const bar=(p,c)=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p||0))}%;${c?'background:'+c:''}"></i></div>`;
const opt=(v,l,cur)=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(l)}</option>`;
const ARROW='<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>';

const KEY='buschlean_v2';
let S;
let STORE_OK=true;
function storeTest(){try{localStorage.setItem('bl_test','1');STORE_OK=localStorage.getItem('bl_test')==='1';localStorage.removeItem('bl_test')}catch(e){STORE_OK=false}}
function persist(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}if(!S||!Array.isArray(S.projects))S={projects:[]};S.projects.forEach(fix)}
function save(){try{S.last=V.pid||S.last||null;if(V.view!=='home'&&P())P().updated=Date.now();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){STORE_OK=false;toast('⚠️ Speichern nicht möglich')}}
let V={view:'home',pid:null,tool:null,vv:'ist',vt:'daten',af:'offen',sm:'weg',aid:null,tRun:null,tLast:null,lst:'',live:null};
const P=()=>S.projects.find(p=>p.id===V.pid);

const newVsm=()=>({customer:{name:'',demand:'',shiftMin:'',shifts:'',breakMin:'',delivery:''},supplier:{name:'',delivery:''},info:{planning:'',custOrder:'',suppOrder:'',control:''},fg:'',steps:[]});
const newStep=()=>({id:uid(),name:'',ct:'',co:'',avail:'',ops:'',par:'1',lot:'',scrap:'',inv:'',flow:'push'});
const newProject=name=>({id:uid(),name,desc:'',created:Date.now(),vsm:{ist:newVsm(),soll:newVsm()},muda:{obs:[],laps:[]},spag:{pts:[],st:[],scale:'1',cycles:''},kata:{challenge:'',challengeBy:'',learners:[],tcs:[],sessions:[]},greif:[],greifLive:{taps:[],cycles:0,parts:[]},talks:[],problems:[],ishi:{problem:'',causes:[]},whys:[],audits:[],actions:[],notes:[]});
function fix(p){const d=newProject(p.name);for(const k in d)if(p[k]==null)p[k]=d[k];if(!p.spag.st)p.spag.st=[];if(!p.muda.laps)p.muda.laps=[];}

function upd(path,val){let o=P();const k=path.split('.');for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=val;save();if(V.live)V.live()}
function upr(path,val){upd(path,val);render()}
function fld(label,path,val,o={}){return `<label class="f${o.cls?' '+o.cls:''}"><span>${label}${o.unit?` <i>(${o.unit})</i>`:''}</span><input ${o.num?'inputmode="decimal"':''} type="${o.type||'text'}" value="${esc(val)}" placeholder="${esc(o.ph||'')}" oninput="upd('${path}',this.value)"></label>`}
function area(label,path,val,ph,rows=3){return `<label class="f"><span>${label}</span><textarea rows="${rows}" placeholder="${esc(ph||'')}" oninput="upd('${path}',this.value)">${esc(val)}</textarea></label>`}

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)}
function modal(h){$('#sheet').innerHTML=h;$('#modal').classList.remove('hidden')}
function closeM(){$('#modal').classList.add('hidden')}

/* ===== Werkzeuge + Kurzanleitungen ===== */
const TOOLS={
kata:{name:'Kata',icon:'🧭',short:'Verbesserungs-Kata als roter Faden: Richtung, Ist-Zustand, Zielzustand und PDCA – mit Coaching-Modus (5 Fragen).',
 guide:{why:'Die Verbesserungs-Kata (Mike Rother, „Toyota Kata“) ist eine Routine, mit der man sich in kleinen, wissenschaftlichen Schritten auf ein Ziel zubewegt, statt große Lösungen vorab zu planen. Die Coaching-Kata ist die passende Routine für Führungskräfte: Mit fünf Fragen begleitest du Mitarbeiter täglich auf diesem Weg. So wird Verbesserung zur Gewohnheit – und die Mitarbeiter lernen, selbst Probleme zu lösen.',
 steps:['Richtung verstehen: Die Challenge für die nächsten 6–12 Monate formulieren, z. B. „Einzelstückfluss in der Endmontage im Kundentakt“.','Ist-Zustand erfassen: mit Wertstrom und Werkzeugen – Fakten, Kennzahlen, Ablauf. Mit „Aus Wertstrom übernehmen“ landen die Werte direkt im Zielzustand.','Nächsten Zielzustand festlegen: 1–3 Wochen entfernt, messbar (Prozesskennzahl mit Start- und Zielwert) und mit einem Lernenden.','Hindernisse sammeln (Parkplatz) und immer nur an EINEM arbeiten – markiert mit ★.','In kleinen PDCA-Schritten experimentieren: vorher die Erwartung aufschreiben, danach Ergebnis und Erkenntnis.','Coaching-Zyklus möglichst täglich, ca. 15–20 Minuten am Prozess: „🎓 Coaching-Zyklus starten“ führt durch die 5 Fragen und schreibt Messwerte, Erkenntnisse und den nächsten Schritt automatisch ins Protokoll.'],
 tip:'Als Coach fragst du – du gibst keine Lösungen vor. Der Lernende soll selbst denken. Der Weg zum Zielzustand ist vorher nicht bekannt; Ungewissheit ist normal und Teil des Lernens.'}},
vsm:{name:'Wertstrom',icon:'🗺️',short:'Material- und Informationsfluss vom Lieferanten bis zum Kunden – Ist- und Soll-Zustand mit Kennzahlen.',
 guide:{why:'Die Wertstromanalyse zeigt den gesamten Fluss einer Produktfamilie vom Lieferanten bis zum Kunden. Sie macht Bestände, Wartezeiten und Engpässe sichtbar und zeigt, wie viel der Durchlaufzeit wirklich wertschöpfend ist. Im Wertstromdesign (Soll) planst du daraus den verbesserten Fluss.',
 steps:['Produktfamilie festlegen: Produkte mit ähnlichen Prozessschritten zusammenfassen.','Beim Kunden starten: Tagesbedarf, Schichtmodell und Pausen eintragen – daraus ergibt sich der Kundentakt.','Den Prozess vor Ort ablaufen (am besten vom Versand rückwärts) und jeden Schritt mit Zykluszeit, Rüstzeit, Verfügbarkeit, Mitarbeitern, parallelen Plätzen und Losgröße erfassen.','Bestände vor jedem Schritt und im Fertigwarenlager zählen – die App rechnet sie in Reichweite (Arbeitstage) um.','Informationsfluss ergänzen: Wie kommen Kundenbestellung, Planung und Lieferantenabruf zustande? Wie wird zwischen den Schritten gesteuert (Push, FIFO, Supermarkt)?','In der Checkliste prüfen, ob alles vollständig ist, dann Karte und Kennzahlen auswerten.','Soll-Zustand anlegen („aus Ist übernehmen“) und Verbesserungen eintragen. Der Vergleich Ist ↔ Soll zeigt den Fortschritt, die Umsetzung läuft über den Maßnahmenplan.'],
 tip:'Zeiten selbst vor Ort messen statt aus dem System zu übernehmen. Rote Prozesskästen bedeuten: effektive Zykluszeit liegt über dem Kundentakt.'}},
muda:{name:'Verschwendung',icon:'🔍',short:'Die 8 Verschwendungsarten vor Ort beobachten, bewerten und abstellen.',
 guide:{why:'Verschwendung ist alles, was Zeit oder Ressourcen kostet, ohne dass der Kunde dafür zahlt. Mit der Muda-Aufnahme dokumentierst du direkt am Arbeitsplatz, wo welche Verschwendung auftritt und wie viel Zeit sie pro Schicht kostet.',
 steps:['Bereich und Zeitraum festlegen, Mitarbeiter vorher informieren.','Am Arbeitsplatz beobachten – nicht eingreifen.','Jede Verschwendung mit Art, Station und kurzer Beschreibung erfassen.','Dauer pro Vorkommen (Sekunden) und Häufigkeit pro Schicht schätzen oder messen.','Auswertung ansehen: Die größten Blöcke zuerst angehen.','Ideen direkt mit „→ Maßnahme“ in den Maßnahmenplan übernehmen.'],
 tip:'Merkhilfe TIMWOODS: Transport, Inventory (Bestände), Motion (Bewegung), Waiting, Overproduction, Overprocessing, Defects, Skills.'}},
time:{name:'Zeitaufnahme',icon:'⏱️',short:'Arbeitsabläufe stoppen und in wertschöpfend, notwendig und Verschwendung einteilen.',
 guide:{why:'Die Zeitaufnahme zeigt, wie sich die Arbeitszeit am Platz zusammensetzt. Nur der wertschöpfende Anteil verändert das Produkt so, wie es der Kunde will – der Rest ist Ansatzpunkt für Verbesserungen.',
 steps:['Station eintragen und Stoppuhr starten.','Optional eine Bezeichnung für den Abschnitt eingeben (z. B. „Schrauben holen“).','Am Ende jedes Abschnitts die passende Kategorie tippen: Grün = wertschöpfend (verändert das Produkt), Gelb = nicht wertschöpfend, aber notwendig (Prüfen, Scannen), Rot = Verschwendung (Suchen, Warten, Laufen).','Die Uhr läuft automatisch für den nächsten Abschnitt weiter.','Mehrere Zyklen aufnehmen und die Anteile auswerten.'],
 tip:'Mindestens 5–10 Zyklen aufnehmen. Ausreißer nicht löschen, sondern notieren – sie zeigen Störungen.'}},
spag:{name:'Spaghetti-Diagramm',icon:'🍝',short:'Laufwege aufzeichnen und Distanzen pro Zyklus und Schicht berechnen.',
 guide:{why:'Das Spaghetti-Diagramm macht die Wege von Mitarbeitern oder Material sichtbar. Viele Kreuzungen und lange Strecken zeigen Bewegungs- und Transportverschwendung und sind der Ansatz für ein besseres Layout.',
 steps:['Maßstab festlegen: Wie viele Meter entspricht ein Kästchen?','Im Modus „Station“ Arbeitsplätze, Regale und Lager setzen und benennen.','Im Modus „Weg“ der Reihe nach die Punkte antippen, die der Mitarbeiter in einem Zyklus abläuft.','Zyklen pro Schicht eintragen – die App rechnet die Laufstrecke und Gehzeit hoch.','Im Soll das Layout neu denken: Material zum Mitarbeiter bringen, nicht umgekehrt.'],
 tip:'Einen kompletten Zyklus mitlaufen. Jeder Weg zählt – auch der zum Drucker oder zur Schublade.'}},
greif:{name:'Greifraumanalyse',icon:'✋',short:'Live mitzählen: Bei jedem Griff des Werkers in den passenden Bereich der Grafik tippen.',
 guide:{why:'Die Greifraumanalyse zeigt, ob Teile und Werkzeuge im optimalen Greifraum liegen. Jeder Griff außerhalb – und besonders jeder Griff hinter sich – kostet Zeit und belastet den Körper. Durch das Mittippen erfasst du live, was der Werker wirklich tut.',
 steps:['Grafik als Draufsicht verstehen: Der Werker steht unten an der Tischkante, oben ist vom Werker weg.','Optional oben ein Teil wählen oder mit „＋ Teil“ anlegen – alle folgenden Griffe werden diesem Teil zugeordnet, bis du ein anderes wählst.','Bei jedem Griff in den passenden Bereich tippen: A = Unterarm, Ellbogen am Körper · B = Arm gestreckt · C = Rumpf beugen/drehen oder seitlich · D = Schritt nötig · H = hinter sich greifen.','Am Ende jedes Arbeitszyklus „Zyklus fertig“ tippen – daraus rechnet die App die Griffe je Zyklus.','Vertippt? „Rückgängig“ nimmt den letzten Griff zurück.','Auswertung: Anteil A+B sollte mindestens 80 % sein, Griffe nach hinten möglichst ganz vermeiden. Kritische Teile direkt als Maßnahme übernehmen.'],
 tip:'Die Punkte in der Grafik bilden eine Wärmekarte – dort, wo sie sich häufen, wird am meisten gegriffen. Häufige Teile gehören direkt vor den Werker in Zone A.'}},
ishi:{name:'Ishikawa',icon:'🐟',short:'Mögliche Ursachen eines Problems strukturiert nach den 6M sammeln.',
 guide:{why:'Das Ishikawa- oder Fischgrätendiagramm hilft im Team, alle möglichen Ursachen eines Problems zu sammeln und zu ordnen, statt vorschnell eine Lösung zu wählen.',
 steps:['Problem klar und messbar formulieren (Kopf des Fisches).','Ursachen den 6M zuordnen: Mensch, Maschine, Methode, Material, Milieu (Umwelt), Messung.','Erst sammeln, dann bewerten – beim Brainstorming nicht diskutieren.','Wahrscheinlichste Ursachen mit ★ markieren.','Hauptursachen mit 5-Why vertiefen und mit Daten bestätigen.'],
 tip:'Mit dem Team direkt vor Ort machen – die Mitarbeiter am Prozess kennen die Ursachen am besten.'}},
why:{name:'5-Why',icon:'❓',short:'Durch wiederholtes Nachfragen von Symptom zur Grundursache.',
 guide:{why:'Mit der 5-Why-Methode gehst du von einem Symptom zur eigentlichen Ursache. So wird das Problem nachhaltig gelöst und nicht nur das Symptom behandelt.',
 steps:['Problem konkret beschreiben (Was, Wo, Wann, Wie viel?).','Fragen: Warum ist das passiert? Antwort eintragen.','Auf jede Antwort erneut „Warum?“ fragen – bis zu fünfmal oder bis eine beeinflussbare Ursache erreicht ist.','Grundursache festhalten.','Gegenmaßnahme ableiten und in den Maßnahmenplan übernehmen.'],
 tip:'Gegenprobe: Die Kette rückwärts mit „deshalb“ lesen. Nie bei „Mitarbeiter hat Fehler gemacht“ stehen bleiben – frag, warum der Fehler möglich war.'}},
s5:{name:'5S-Audit',icon:'🧹',short:'Ordnung und Sauberkeit am Arbeitsplatz bewerten und den Verlauf verfolgen.',
 guide:{why:'5S schafft die Basis für stabile Prozesse: Sortieren, Systematisieren, Säubern, Standardisieren, Selbstdisziplin. Mit regelmäßigen Audits wird der Stand messbar.',
 steps:['Neues Audit anlegen und Bereich eintragen.','Jede Frage vor Ort bewerten: 0 = nicht erfüllt … 4 = vollständig erfüllt.','Das Netzdiagramm zeigt Stärken und Schwächen je S.','Abweichungen als Maßnahmen übernehmen.','Audit regelmäßig wiederholen (z. B. monatlich) und den Verlauf beobachten.'],
 tip:'Vorher-/Nachher-Fotos sind die beste Motivation fürs Team.'}},
act:{name:'Maßnahmenplan',icon:'✅',short:'Alle Maßnahmen mit Verantwortlichem, Termin und Status an einem Ort.',
 guide:{why:'Der Maßnahmenplan sammelt alle Verbesserungen aus den Werkzeugen und sorgt dafür, dass sie umgesetzt werden. Er ist die Grundlage für die Fortschrittskennzahlen.',
 steps:['Maßnahme konkret formulieren (Was genau wird geändert?).','Verantwortlichen und Termin festlegen.','Status antippen, um ihn weiterzuschalten: offen → in Arbeit → erledigt.','Überfällige Maßnahmen sind rot markiert.','Regelmäßig im Team durchgehen, z. B. in der Shopfloor-Runde.'],
 tip:'Eine Maßnahme ohne Namen und Termin ist nur eine Idee.'}},
talk:{name:'Mitarbeitergespräche',icon:'💬',short:'Ideen, Ärgernisse und Belastungen aus Gesprächen mit Mitarbeitern dokumentieren und bis zur Rückmeldung verfolgen.',
 guide:{why:'Die Mitarbeiter am Prozess kennen die Probleme am besten. In gezielten Gesprächen kommen Verbesserungsideen und Belastungen ans Licht, die in keiner Messung auftauchen. Entscheidend ist, dass jedes Anliegen verfolgt und dem Mitarbeiter zurückgemeldet wird – sonst sagt beim nächsten Mal niemand mehr etwas.',
 steps:['Gespräch am Arbeitsplatz führen und das Ziel erklären: Es geht um den Prozess, nicht um die Bewertung der Person.','Mit den Leitfragen ins Gespräch kommen (im Werkzeug aufklappbar) – zuhören, nicht rechtfertigen.','Pro Anliegen einen Eintrag anlegen: Art (Idee, Ärgernis/Belastung, Läuft gut), Thema, Station, Beschreibung und gern ein wörtliches Zitat.','Belastung bzw. Dringlichkeit von 1 bis 5 gemeinsam mit dem Mitarbeiter einschätzen.','Status antippen, um ihn weiterzuschalten: neu → in Prüfung → umgesetzt → abgelehnt. Umsetzbares direkt mit „→ Maßnahme“ übernehmen.','Dem Mitarbeiter Rückmeldung geben und abhaken – auch bei einer Ablehnung, dann mit Begründung.'],
 tip:'Namen nur mit Einverständnis notieren, im Zweifel „anonym“ wählen. Die Daten liegen nur auf deinem Gerät – beim Export und Weitergeben an Datenschutz und ggf. Betriebsrat denken.'}},
prob:{name:'Probleme',icon:'🎯',short:'Jedes Problem mit eigener Akte: Maßnahmen anhängen und den Verlauf als Zeitstrahl verfolgen.',
 guide:{why:'Im Problemspeicher bekommt jedes Problem eine eigene Akte. Du siehst, welche Maßnahmen dazu laufen, wer verantwortlich ist und wie sich die Lösung über die Zeit entwickelt hat. Der Zeitplan zeigt jede Maßnahme als Balken mit Termin, der Verlauf jede Änderung mit Datum.',
 steps:['Problem anlegen – hier direkt oder per „→ Problem“ aus Verschwendung, Mitarbeitergesprächen, Ishikawa oder 5-Why.','Problem konkret beschreiben: Was, wo, seit wann, wie viel?','Maßnahmen direkt im Problem anlegen oder vorhandene aus dem Maßnahmenplan zuordnen.','Status der Maßnahmen antippen (offen → in Arbeit → erledigt) – jede Änderung landet mit Datum im Verlauf, Terminverschiebungen auch.','Zwischenstände als Update festhalten, z. B. „Test mit Balancer läuft seit Montag“.','Wirkung prüfen und das Problem dann auf „gelöst“ setzen.'],
 tip:'Erledigte Maßnahmen heißen noch nicht, dass das Problem gelöst ist – erst die geprüfte Wirkung zählt. Rote Rauten im Zeitplan = Termin überschritten.'}},
notes:{name:'Notizen',icon:'📝',short:'Beobachtungen, Gesprächsnotizen und Ideen zum Projekt.',
 guide:{why:'Hier sammelst du alles, was nicht in ein Werkzeug passt oder was du schnell festhalten willst.',
 steps:['Notiz schreiben und optional einem Werkzeug zuordnen.','Zugeordnete Notizen erscheinen auch direkt im jeweiligen Werkzeug.'],tip:''}}
};

/* ===== Navigation ===== */
function go(v){V.view=v;render();window.scrollTo(0,0)}
function openP(id){V.pid=id;save();go('project')}
function openT(id,keep){if(!keep){V.prid=null;V.tcid=null;V.coach=null}V.tool=id;go('tool')}
function guide(id){const t=TOOLS[id],g=t.guide;modal(`<h2>${t.icon} ${t.name}</h2><h3>Wofür?</h3><p>${g.why}</p><h3>So geht's</h3><ol>${g.steps.map(s=>`<li>${s}</li>`).join('')}</ol>${g.tip?`<div class="tip">💡 ${g.tip}</div>`:''}<button class="btn pri wide" onclick="closeM()">Verstanden</button>`)}
const intro=id=>`<div class="intro"><span>${TOOLS[id].short}</span><button class="lnk" onclick="guide('${id}')">Anleitung</button></div>`;
function hdr(title,back,tool){return `${back?`<button class="back" onclick="${back}">‹</button>`:''}<h1>${title}</h1>${tool?`<button class="info" onclick="guide('${tool}')">ⓘ Anleitung</button>`:''}`}

function render(){
 V.live=null;const h=$('#hdr'),a=$('#app');
 if(V.view==='project'&&!P())V.view='home';
 if(V.view==='home'){h.innerHTML=hdr(`<span class="brand">${BMARK}<span><span class="bt">B<i>-</i>LEAN</span><span class="bs">be lean. · Busch LEAN</span></span></span>`);a.innerHTML=homeV()}
 else if(V.view==='lib'){h.innerHTML=hdr('Werkzeuge & Anleitungen',"go('home')");a.innerHTML=libV()}
 else if(V.view==='project'){h.innerHTML=hdr(esc(P().name),"go('home')");a.innerHTML=projectV(P())}
 else if(V.view==='tool'){const p=P();if(!p)return go('home');const t=TOOLS[V.tool];h.innerHTML=hdr(V.coach?'🎓 Coaching-Kata':t.icon+' '+t.name,toolBack(),V.coach?null:V.tool);a.innerHTML=R[V.tool](p)}
}

function projStats(p){const t=p.actions.length,d=p.actions.filter(a=>a.status==='erledigt').length;return{compl:vcomp(p.vsm.ist),total:t,done:d}}
const PCOL=['#0f6e56','#2563eb','#7c3aed','#d97706','#db2777','#0891b2','#65a30d','#475569'];
const pcol=p=>{let h=0;for(const c of p.id)h=(h*31+c.charCodeAt(0))>>>0;return PCOL[h%PCOL.length]};
const ago=t=>{if(!t)return '';const d=(Date.now()-t)/864e5;if(d<1/24)return 'gerade eben';if(d<1)return 'heute';if(d<2)return 'gestern';if(d<7)return `vor ${Math.floor(d)} Tagen`;return new Date(t).toLocaleDateString('de-DE')};
function projCard(p){
 const k=projStats(p),c=pcol(p),td=today(),ci=vcalc(p.vsm.ist),sc=vcomp(p.vsm.soll);
 const openA=p.actions.filter(a=>a.status!=='erledigt').length,late=p.actions.filter(a=>a.status!=='erledigt'&&a.due&&a.due<td).length,openT=(p.talks||[]).filter(t=>t.status==='neu'||t.status==='in Prüfung').length;
 const mini=(l,v,pc)=>`<div class="pm"><div class="row"><span>${l}</span><b>${v}</b></div>${bar(pc,c)}</div>`;
 const ini=p.name.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
 return `<div class="pcard" style="--pc:${c}" onclick="openP('${p.id}')">
 <div class="ptop"><div class="pav">${esc(ini)}</div><div style="flex:1;min-width:0"><div class="pname">${esc(p.name)}</div><div class="psub">${p.desc?esc(trunc(p.desc,70)):'Zuletzt bearbeitet '+ago(p.updated||p.created)}</div></div><div class="pgo">›</div></div>
 <div class="pbody">${mini('Ist',k.compl+' %',k.compl)}${mini('Soll',sc+' %',sc)}${mini('Maßnahmen',k.done+'/'+k.total,pct(k.done,k.total))}</div>
 <div class="pfoot">${isFinite(ci.invDays)?`<span class="chip">⏳ DLZ ${fmt(ci.invDays,1)} AT</span>`:''}${openA?`<span class="chip">✅ ${openA} offen</span>`:''}${late?`<span class="chip c" style="background:var(--bad)">⚠️ ${late} überfällig</span>`:''}${openT?`<span class="chip">💬 ${openT} Anliegen</span>`:''}${(p.problems||[]).filter(x=>x.status!=='gelöst').length?`<span class="chip">🎯 ${(p.problems||[]).filter(x=>x.status!=='gelöst').length} Probleme</span>`:''}${p.muda.obs.length?`<span class="chip">🔍 ${p.muda.obs.length}</span>`:''}${p.desc?`<span class="mut sm" style="margin-left:auto">${ago(p.updated||p.created)}</span>`:''}</div></div>`;
}

function vcalc(v){
 const c=v.customer,d=num(c.demand),sm=num(c.shiftMin),sh=num(c.shifts),br=num(c.breakMin)||0;
 const avail=sh*(sm-br)*60,takt=avail/d;
 const steps=v.steps.map(s=>{const ct=num(s.ct),par=num(s.par)||1,av=(num(s.avail)||100)/100,eff=ct/par,days=num(s.inv)/d;return{...s,ctN:ct,eff,days,util:eff*d/(avail*av)*100,over:isFinite(takt)&&eff>takt}});
 const fgDays=num(v.fg)/d;
 const invDays=steps.reduce((a,s)=>a+(isFinite(s.days)?s.days:0),0)+(isFinite(fgDays)?fgDays:0);
 const bz=steps.reduce((a,s)=>a+(isFinite(s.ctN)?s.ctN:0),0);
 const dlzS=invDays*avail+bz,flow=bz>0&&isFinite(dlzS)&&dlzS>0?bz/dlzS*100:NaN;
 const bottleneck=steps.reduce((m,s)=>isFinite(s.eff)&&(!m||s.eff>m.eff)?s:m,null);
 const ops=steps.reduce((a,s)=>a+(num(s.ops)||0),0);
 const invPcs=steps.reduce((a,s)=>a+(num(s.inv)||0),0)+(num(v.fg)||0);
 return{d,avail,takt,steps,fgDays,invDays:steps.length||has(v.fg)?invDays:NaN,bz,flow,bottleneck,ops,opsTheo:bz/takt,invPcs};
}

 s+=`<path d="M${W-130} 44H${ppx+172}" class="info" marker-end="url(#ah)"/><text x="${(W-130+ppx+170)/2}" y="37" text-anchor="middle" class="sm">${esc(trunc(v.info.custOrder,24))}</text>`;

 v.steps.forEach((st,i)=>{if(i===0||st.flow==='push')s+=`<path d="M${W/2} 72L${px(i)+BW/2} 162" class="info" marker-end="url(#ah)"/>`});
 s+=`<path d="M65 76V${MY}H${px(0)-G/2-17}" class="mat" marker-end="url(#ah)"/><text x="72" y="104" class="sm">🚚 ${esc(trunc(v.supplier.delivery,14))}</text>`;
 v.steps.forEach((st,i)=>{
  const x=px(i),cs=c.steps[i],tx=x-G/2,lab={push:'PUSH ⇢',fifo:'FIFO',sm:'⟲ Supermarkt'}[st.flow]||'';

 list.sort((a,b)=>(isOpenT(b)-isOpenT(a))||b.level-a.level||b.created-a.created);
 const card=t=>{const i=p.talks.indexOf(t),k=TALK_KIND[t.kind]||TALK_KIND.idee,q=`talks.${i}`;return `<div class="card"><div class="row"><span><span class="chip c" style="background:${k[1]}">${k[0]}</span> <span class="chip">${esc(t.topic)}</span></span><button class="st ${TALK_CLS[t.status]}" onclick="talkSt('${t.id}')">${t.status}</button></div>

  <details style="margin-top:6px"><summary class="sm mut">Bearbeiten</summary><div class="grid2" style="margin-top:8px">
  ${area('Anliegen',q+'.text',t.text,'',2).replace('<label class="f">','<label class="f full">')}${fld('Zitat',q+'.quote',t.quote,{cls:'full'})}

 <label class="f" style="display:flex;align-items:flex-end;gap:8px;padding-bottom:9px"><input id="tk_anon" type="checkbox" style="width:auto"${L.anon?' checked':''} onchange="document.getElementById('tk_person').disabled=this.checked"> anonym</label>

 <label class="f"><span>Thema</span><select id="tk_topic">${TALK_TOPIC.map(x=>opt(x,x,'')).join('')}</select></label>
 <label class="f full"><span>Anliegen</span><textarea id="tk_text" rows="3" placeholder="Was genau ist das Problem bzw. die Idee?"></textarea></label>
 <label class="f full"><span>Zitat <i>(optional)</i></span><input id="tk_quote" placeholder="Wörtlich, was der Mitarbeiter gesagt hat"></label>

 <button class="btn pri wide" onclick="addTalk()">+ Anliegen speichern</button><p class="mut sm" style="margin:6px 0 0">Datum, Station und Mitarbeiter bleiben für das nächste Anliegen aus demselben Gespräch stehen.</p></div>
 <h2>Auswertung</h2><div class="kpis">${kpi('Anliegen',ts.length,'',`${concerns.length} Ideen/Ärgernisse`)}${kpi('Offen',open,'','neu oder in Prüfung')}${kpi('Rückmeldequote',fmt(pct(fb,concerns.length),0),'%',`${fb} von ${concerns.length}`)}${kpi('Umgesetzt',fmt(pct(done,concerns.length),0),'%',`${done} von ${concerns.length}`)}</div>
 ${byT.length?`<div class="card" style="margin-top:8px"><div class="sm mut" style="margin-bottom:4px">Nach Thema · <span style="color:#dc2626">■</span> Ärgernis <span style="color:#2563eb">■</span> Idee <span style="color:#16a34a">■</span> Läuft gut</div>${byT.map(([tp,c,n])=>`<div class="prog"><div class="row sm"><span>${tp}</span><b>${n}</b></div><div class="stack" style="width:${n/mx*100}%;margin:2px 0;height:12px">${['aerger','idee','positiv'].map(k=>c[k]?`<i style="width:${pct(c[k],n)}%;background:${TALK_KIND[k][1]}"></i>`:'').join('')}</div></div>`).join('')}</div>`:''}
 ${top.length?`<h2>Größte offene Ärgernisse</h2>${top.map(card).join('')}`:''}

 ${list.map(card).join('')||'<div class="empty">Keine Einträge in dieser Ansicht.</div>'}`+notesBox(p,'talk');
}

const XL_URL='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
function loadXL(){if(window.ExcelJS)return Promise.resolve();return new Promise((res,rej)=>{const s=document.createElement('script');s.src=XL_URL;s.onload=res;s.onerror=()=>{s.remove();rej(new Error('offline'))};document.head.appendChild(s)})}
const svgOf=h=>{const m=String(h||'').match(/<svg[\s\S]*<\/svg>/);return m?m[0]:null};
function inlineSvg(html){
 const host=document.createElement('div');host.className='xl';host.style.cssText='position:fixed;left:-99999px;top:0';host.innerHTML=html;document.body.appendChild(host);
 const svg=host.querySelector('svg'),vb=(svg.getAttribute('viewBox')||'').split(/[ ,]+/).map(Number);
 const W=vb[2]||+svg.getAttribute('width'),H=vb[3]||+svg.getAttribute('height');
 svg.setAttribute('width',W);svg.setAttribute('height',H);svg.style.cssText=`width:${W}px;height:${H}px;max-width:none`;
 const props=['fill','fill-opacity','stroke','stroke-width','stroke-dasharray','stroke-linejoin','stroke-linecap','opacity','font-size','font-weight','font-family','font-style','color'];
 const els=[...svg.querySelectorAll('*')],sty=els.map(el=>{const cs=getComputedStyle(el);return props.map(k=>k+':'+cs.getPropertyValue(k)).join(';')});
 els.forEach((el,i)=>el.setAttribute('style',sty[i]));svg.style.color=getComputedStyle(svg).color;svg.removeAttribute('class');
 const xml=new XMLSerializer().serializeToString(svg);host.remove();return{xml,W,H};
}
async function svgPng(html,scale=2){
 const{xml,W,H}=inlineSvg(html);
 const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('Diagramm konnte nicht gezeichnet werden'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml)});
 const cv=document.createElement('canvas');cv.width=Math.round(W*scale);cv.height=Math.round(H*scale);const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
 return{base64:cv.toDataURL('image/png'),w:W,h:H};
}
function hbar(items,unit,dg=0,max){const W=620,L=190,rh=28,H=items.length*rh+12,mx=max||Math.max(1e-9,...items.map(x=>x[1]||0));let s='';

 return `<svg viewBox="0 0 ${W} ${H}">${s}</svg>`}
function spagSvg(sp){let g='';for(let x=0;x<=400;x+=20)g+=`<line x1="${x}" y1="0" x2="${x}" y2="280" class="gl"/>`;for(let y=0;y<=280;y+=20)g+=`<line x1="0" y1="${y}" x2="400" y2="${y}" class="gl"/>`;

const nn=v=>{const x=num(v);return isFinite(x)?x:null},rd=(x,d=1)=>isFinite(x)?Math.round(x*10**d)/10**d:null,dDE=d=>d?new Date(d).toLocaleDateString('de-DE'):'';

function xTable(ws,heads,rows,widths){const r0=ws._r;
 heads.forEach((h,i)=>{const c=ws.getCell(r0,i+1);c.value=h;c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0F6E56'}};c.alignment={vertical:'middle',wrapText:true}});

 (widths||[]).forEach((w,i)=>{const col=ws.getColumn(i+1);col.width=Math.max(col.width||0,w)});

 if(!k.challenge.trim()&&!k.tcs.length)return `<div class="card link" onclick="openT('kata')" style="border-left:5px solid var(--pri)"><div class="row"><b>🧭 Mit der Verbesserungs-Kata starten</b><span class="lnk">›</span></div><div class="mut sm">Richtung festlegen, Ist-Zustand aus dem Wertstrom, Zielzustand definieren und in kleinen Schritten mit dem Team experimentieren.</div></div>`;
 return `<div class="card link" onclick="openT('kata')" style="border-left:5px solid var(--pri)"><div class="row"><span class="mut sm">🧭 Verbesserungs-Kata · Richtung</span><span class="lnk">›</span></div><div style="font-weight:800;font-size:16px;margin:2px 0 8px">${esc(k.challenge||'Challenge noch nicht formuliert')}</div>
 ${act.map(tc=>{const m=tc.metrics[0],pg=m?mProg(tc,m):NaN,due=tc.nextCoach&&tc.nextCoach<=today();return `<div style="margin-top:6px"><div class="row sm"><span><b>${esc(tc.title)}</b>${tc.learner?' · 🎓 '+esc(tc.learner):''}</span><span class="mut">bis ${dDE(tc.by+'T12:00')}</span></div>${m?`<div class="row sm mut"><span>${esc(m.name)}: ${fmt(mLast(tc,m),1)} → Ziel ${esc(m.target||'?')} ${esc(m.unit)}</span><span>${isFinite(pg)?fmt(pg,0)+' %':''}</span></div>${bar(pg)}`:''}${due?'<div class="sm over" style="margin-top:3px">🎓 Coaching fällig</div>':''}</div>`}).join('')||'<div class="mut sm">Kein aktiver Zielzustand</div>'}</div>`}
function kataV(p){
 if(V.coach&&tcById(V.coach.tcId))return coachV(p,tcById(V.coach.tcId));V.coach=null;
 const tc=curTc();if(tc)return tcDetail(p,tc);V.tcid=null;
 const k=p.kata,list=k.tcs.slice().sort((a,b)=>TCST.indexOf(a.status)-TCST.indexOf(b.status)||b.created-a.created),due=k.tcs.filter(t=>t.status==='aktiv'&&t.nextCoach&&t.nextCoach<=today());
 return intro('kata')+kataPattern(p)+(due.length?`<div class="intro" style="background:#fef3c7;color:#92400e"><span>🎓 Coaching fällig: ${due.map(t=>esc(t.title)+(t.learner?' ('+esc(t.learner)+')':'')).join(', ')}</span><button class="lnk" onclick="kStartCoach('${due[0].id}')">Starten</button></div>`:'')+
 `<h2>1 · Richtung / Challenge</h2><div class="card"><label class="f"><span>Wo wollen wir in 6–12 Monaten hin?</span><textarea id="kch" rows="2" placeholder="z. B. Einzelstückfluss in der Endmontage im Kundentakt, DLZ unter 2 Tagen" oninput="upd('kata.challenge',this.value)">${esc(k.challenge)}</textarea></label><div style="margin-top:8px">${fld('Zieltermin','kata.challengeBy',k.challengeBy,{type:'date'})}</div></div>
 <h2>2 · Ist-Zustand</h2><div class="card row"><span class="sm">Ist-Zustand im Wertstrom erfasst: <b>${vcomp(p.vsm.ist)} %</b> · DLZ ${fmt(vcalc(p.vsm.ist).invDays,1)} AT</span><button class="btn sm" onclick="openT('vsm')">Wertstrom ›</button></div>
 <h2>3 · Zielzustände</h2>${list.map(tc=>{const m=tc.metrics[0],pg=m?mProg(tc,m):NaN,ob=tc.obstacles.find(o=>o.focus);return `<div class="card link" onclick="kOpenTc('${tc.id}')"><div class="row"><b style="font-size:16px">${esc(tc.title)}</b><span class="st ${tc.status==='aktiv'?'arbeit':tc.status==='erreicht'?'erledigt':'abgelehnt'}">${tc.status}</span></div>
  <div class="mut sm" style="margin:2px 0 6px">${tc.learner?'🎓 '+esc(tc.learner)+' · ':''}bis ${dDE(tc.by+'T12:00')} · ${tc.exps.length} Experimente · ${tc.obstacles.filter(o=>o.status!=='beseitigt').length} Hindernisse offen</div>
  ${m?progRow(`${esc(m.name)}: ${fmt(mLast(tc,m),1)} → ${esc(m.target||'?')} ${esc(m.unit)}`,isFinite(pg)?fmt(pg,0)+' %':'–',pg):'<div class="mut sm">Noch keine Kennzahl festgelegt</div>'}
  ${ob?`<div class="sm" style="margin-top:4px">🎯 Aktuelles Hindernis: ${esc(ob.text)}</div>`:''}${tc.nextCoach?`<div class="sm ${tc.nextCoach<=today()?'over':'mut'}" style="margin-top:2px">🎓 Nächstes Coaching: ${dDE(tc.nextCoach+'T12:00')}</div>`:''}</div>`}).join('')||'<div class="empty">Noch kein Zielzustand. Leg unten den nächsten Zielzustand an – 1 bis 3 Wochen entfernt.</div>'}
 <div class="card"><input id="ktc" placeholder="Nächster Zielzustand, z. B. Endmontage im Takt 450 s"><div class="row" style="margin-top:8px;flex-wrap:nowrap"><select id="ktl">${opt('','Lernender (optional)','')}${k.learners.map(l=>opt(l,'🎓 '+l,'')).join('')}</select><button class="btn pri" onclick="kNewTc()">＋ Anlegen</button></div></div>
 <h2>Lernende (Coaching)</h2><div class="card"><div class="chips" style="margin:0">${k.learners.map((l,i)=>`<span class="chip">🎓 ${esc(l)} <button class="ib" style="padding:0 2px;font-size:12px" onclick="kDelLearner(${i})">✕</button></span>`).join('')}<button class="chip" onclick="kAddLearner()">＋ Lernender</button></div><p class="mut sm" style="margin:8px 0 0">Namen nur mit Einverständnis – oder ein Kürzel verwenden.</p></div>
 ${k.sessions.length?`<h2>Letzte Coaching-Zyklen</h2>${k.sessions.slice().sort((a,b)=>b.t-a.t).slice(0,5).map(sessCard).join('')}`:''}`+notesBox(p,'kata');
}
function sessCard(s){const tc=tcById(s.tcId),a=s.answers||{};return `<div class="card"><div class="row"><b class="sm">🎓 ${esc(s.learner||'–')} · ${tc?esc(tc.title):'(gelöscht)'}</b><span class="mut sm">${new Date(s.t).toLocaleDateString('de-DE')}</span></div>
 ${a.learned?`<div class="sm" style="margin-top:4px"><b>Gelernt:</b> ${esc(a.learned)}</div>`:''}${a.obstacleText?`<div class="sm"><b>Hindernis:</b> ${esc(a.obstacleText)}</div>`:''}${a.step?`<div class="sm"><b>Nächster Schritt:</b> ${esc(a.step)}${a.expect?' – <i>erwartet: '+esc(a.expect)+'</i>':''}</div>`:''}${a.when?`<div class="mut sm">Nächstes Coaching: ${dDE(a.when+'T12:00')}</div>`:''}</div>`}
function tcDetail(p,tc){
 const k=p.kata,i=k.tcs.indexOf(tc),q=`kata.tcs.${i}`,days=Math.ceil((new Date(tc.by+'T12:00')-Date.now())/864e5),ob=tc.obstacles.find(o=>o.focus),obName=id=>(tc.obstacles.find(o=>o.id===id)||{}).text||'';
 const metrics=tc.metrics.map((m,j)=>{const pg=mProg(tc,m),ms=tc.meas.filter(x=>x.mid===m.id).sort((a,b)=>b.t-a.t);return `<div class="card"><div class="row"><b>${esc(m.name)}${m.unit?' <span class="mut sm">('+esc(m.unit)+')</span>':''}</b><button class="ib" onclick="kDelMetric('${m.id}')">✕</button></div>
  <div class="grid3" style="margin-top:6px">${fld('Start',`${q}.metrics.${j}.start`,m.start,{num:1})}${fld('Ziel',`${q}.metrics.${j}.target`,m.target,{num:1})}<label class="f"><span>Aktuell</span><input value="${fmt(mLast(tc,m),2)}" disabled></label></div>
  <div style="margin-top:8px">${progRow('Fortschritt zum Ziel',isFinite(pg)?fmt(pg,0)+' %':'–',pg)}</div>${runChart(tc,m)}
  <div class="row" style="margin-top:6px;flex-wrap:nowrap"><input id="mv_${m.id}" inputmode="decimal" placeholder="Neuer Messwert (heute)"><button class="btn sm" onclick="kAddMeas('${m.id}')">＋ Messen</button></div>
  ${ms.length?`<details style="margin-top:6px"><summary class="sm mut">${ms.length} Messwerte</summary>${ms.map(x=>`<div class="row sm" style="padding:3px 0"><span>${dDE(x.date+'T12:00')}</span><span><b>${fmt(x.val,2)}</b> <button class="ib" onclick="kDelMeas(${x.t})">✕</button></span></div>`).join('')}</details>`:''}</div>`}).join('');
 return `<button class="btn pri wide" style="margin:0 0 12px;padding:14px;font-size:16px" onclick="kStartCoach('${tc.id}')">🎓 Coaching-Zyklus starten (5 Fragen)</button>
 <div class="card">${fld('Zielzustand',`${q}.title`,tc.title)}<div class="grid2" style="margin-top:8px"><label class="f"><span>Lernender</span><select onchange="upd('${q}.learner',this.value)">${opt('','–',tc.learner)}${k.learners.map(l=>opt(l,l,tc.learner)).join('')}</select></label>${fld('Erreichen bis',`${q}.by`,tc.by,{type:'date'})}</div>
 <div class="mut sm" style="margin-top:6px">${tc.status==='aktiv'?(days>=0?`Noch ${days} Tage`:`<span class="over">${-days} Tage über Termin</span>`):''}${tc.nextCoach?' · Nächstes Coaching: '+dDE(tc.nextCoach+'T12:00'):''}</div></div>
 <div class="seg">${TCST.map(st=>`<button class="${tc.status===st?'on':''}" onclick="kSetSt('${st}')">${st==='erreicht'?'🏁 ':''}${st}</button>`).join('')}</div>
 <h2>Prozesskennzahlen</h2>${metrics||'<div class="empty sm">Woran misst du, ob der Zielzustand erreicht ist? Wähle unten eine Kennzahl.</div>'}
 <div class="card"><div class="sm mut" style="margin-bottom:6px">Schnell hinzufügen (Startwert aus dem Wertstrom):</div><div class="chips" style="margin:0">${kPresets().map((pr,j)=>`<button class="chip" onclick="kAddMetric(${j})">${pr[0]}${pr[2]!=null?' · '+fmt(pr[2],1):''}</button>`).join('')}</div>
 <details style="margin-top:8px"><summary class="sm">Eigene Kennzahl</summary><div class="grid2" style="margin-top:8px"><input id="kmn" placeholder="Name"><input id="kmu" placeholder="Einheit"><input id="kms" inputmode="decimal" placeholder="Startwert"><input id="kmt" inputmode="decimal" placeholder="Zielwert"></div><button class="btn wide" onclick="kAddMetric()">＋ Kennzahl</button></details></div>
 <h2>Ist-Zustand & Zielzustand</h2><div class="card">${area('Ist-Zustand (Fakten, Ablauf, Kennzahlen)',`${q}.current`,tc.current,'Wie läuft der Prozess heute?',3)}<button class="btn sm" style="margin-top:6px" onclick="kIstFromVsm()">⤵︎ Aus Wertstrom übernehmen</button>
 <div style="height:10px"></div>${area('Zielzustand (gewünschter Ablauf / Muster)',`${q}.target`,tc.target,'Wie soll der Prozess am Zieltermin laufen? z. B. Jeder Zyklus in 450 s ±10 %, Material im Greifraum A',3)}</div>
 <h2>Hindernisse (Parkplatz)</h2><div class="card"><div class="row" style="flex-wrap:nowrap"><input id="kob" placeholder="Neues Hindernis" onkeydown="if(event.key==='Enter')kAddObs()"><button class="btn sm pri" onclick="kAddObs()">＋</button></div>
 ${tc.obstacles.map(o=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><button class="ib" title="Aktuelles Hindernis" style="font-size:18px;color:${o.focus?'var(--warn)':'var(--mut)'}" onclick="kObsFocus('${o.id}')">${o.focus?'★':'☆'}</button><span style="flex:1;${o.status==='beseitigt'?'text-decoration:line-through;opacity:.6':''}${o.focus?';font-weight:700':''}">${esc(o.text)}</span><button class="st ${OCLS[o.status]}" onclick="kObsSt('${o.id}')">${o.status}</button><button class="ib" onclick="kDelObs('${o.id}')">✕</button></div>`).join('')}
 <p class="mut sm" style="margin:8px 0 0">★ = Hindernis, an dem gerade gearbeitet wird – immer nur eins. Status antippen zum Weiterschalten.</p></div>
 <h2>PDCA-Experimente</h2>${tc.exps.slice().sort((a,b)=>b.t-a.t).map(e=>{const j=tc.exps.indexOf(e),eq=`${q}.exps.${j}`;return `<div class="card"><div class="row"><span class="mut sm">${dDE(e.date+'T12:00')}${e.obstacle?' · 🎯 '+esc(trunc(obName(e.obstacle),40)):''}</span><span><button class="btn sm${e.done?' on':''}" onclick="kExpDone('${e.id}')">${e.done?'✓ ausgewertet':'offen'}</button><button class="ib" onclick="kDelExp('${e.id}')">✕</button></span></div>
  <div class="grid2" style="margin-top:6px">${fld('Schritt (Plan/Do)',`${eq}.step`,e.step,{cls:'full'})}${fld('Erwartung',`${eq}.expect`,e.expect,{cls:'full'})}${fld('Was ist passiert? (Check)',`${eq}.result`,e.result,{cls:'full'})}${fld('Was gelernt? (Act)',`${eq}.learned`,e.learned,{cls:'full'})}</div></div>`}).join('')||'<div class="empty sm">Noch keine Experimente – am einfachsten über den Coaching-Zyklus.</div>'}
 <details class="card"><summary class="sm">Experiment manuell eintragen</summary><input id="kes" style="margin-top:8px" placeholder="Nächster Schritt"><input id="kee" style="margin-top:8px" placeholder="Was erwartest du?"><button class="btn wide" onclick="kAddExp()">＋ Experiment</button></details>
 ${k.sessions.some(s=>s.tcId===tc.id)?`<h2>Coaching-Protokoll</h2>${k.sessions.filter(s=>s.tcId===tc.id).sort((a,b)=>b.t-a.t).map(sessCard).join('')}`:''}
 <button class="btn del sm" style="margin-top:10px" onclick="kDelTc()">Zielzustand löschen</button>`;
}
/* --- Coaching-Kata: die 5 Fragen --- */
const CQ=[{k:'tz',n:'1',q:'Was ist der Zielzustand?',h:'Der Lernende beschreibt den Zielzustand in eigenen Worten – nicht ablesen lassen. Was ist die Zielkennzahl, wie soll der Ablauf aussehen?'},
 {k:'ist',n:'2',q:'Wie ist der Ist-Zustand jetzt?',h:'Fakten und Daten statt Meinungen. Wenn möglich direkt am Prozess messen und die aktuellen Werte eintragen.'},
 {k:'refl',n:'↺',q:'Rückblick auf den letzten Schritt',h:'Was war dein letzter Schritt? Was hast du erwartet? Was ist tatsächlich passiert? Was hast du gelernt?'},
 {k:'obs',n:'3',q:'Welche Hindernisse hindern dich daran, den Zielzustand zu erreichen? An welchem arbeitest du jetzt?',h:'Immer nur EIN Hindernis gleichzeitig. Neue Hindernisse kommen auf den Parkplatz.'},
 {k:'next',n:'4',q:'Was ist dein nächster Schritt? Was erwartest du?',h:'Ein kleiner, schneller Schritt – am besten heute oder morgen umsetzbar. Die Erwartung vorher festhalten!'},
 {k:'when',n:'5',q:'Wann können wir uns ansehen, was wir aus diesem Schritt gelernt haben?',h:'So bald wie möglich – täglich ist ideal.'}];
function kStartCoach(id){const tc=tcById(id),f=tc.obstacles.find(o=>o.focus),tm=new Date(Date.now()+864e5).toISOString().slice(0,10);V.tcid=id;V.coach={tcId:id,step:0,a:{focus:f?f.id:'',when:tm},m:{}};if(V.tool!=='kata'){V.tool='kata';V.view='tool'}render();scrollTo(0,0)}
function cGo(d){const c=V.coach;c.step=Math.max(0,Math.min(CQ.length-1,c.step+d));render();scrollTo(0,0)}
function coachV(p,tc){const c=V.coach,a=c.a,s=CQ[c.step],prev=openExp(tc),fld2=(k,ph,rows=2)=>`<textarea rows="${rows}" placeholder="${esc(ph)}" oninput="V.coach.a.${k}=this.value">${esc(a[k]||'')}</textarea>`;
 let body='';
 if(s.k==='tz')body=`${tc.target||tc.metrics.length?`<div class="tip"><b>Hinterlegt:</b> ${esc(tc.target||tc.title)}${tc.metrics.map(m=>`<br>• ${esc(m.name)}: Ziel ${esc(m.target||'?')} ${esc(m.unit)} bis ${dDE(tc.by+'T12:00')}`).join('')}</div>`:''}<h3>Antwort des Lernenden</h3>${fld2('tz','Notiz (optional)')}`;
 if(s.k==='ist')body=`${tc.metrics.map(m=>`<label class="f" style="margin-top:8px"><span>${esc(m.name)} ${m.unit?'('+esc(m.unit)+')':''} · zuletzt ${fmt(mLast(tc,m),2)} · Ziel ${esc(m.target||'?')}</span><input inputmode="decimal" placeholder="Heutiger Messwert" value="${esc(c.m[m.id]||'')}" oninput="V.coach.m['${m.id}']=this.value"></label>`).join('')||'<p class="mut sm">Für diesen Zielzustand ist noch keine Kennzahl hinterlegt.</p>'}<h3>Beobachtung</h3>${fld2('ist','Was sieht der Lernende am Prozess?')}`;
 if(s.k==='refl')body=prev?`<div class="tip"><b>Letzter Schritt (${dDE(prev.date+'T12:00')}):</b> ${esc(prev.step)}${prev.expect?`<br><b>Erwartet:</b> ${esc(prev.expect)}`:''}</div><h3>Was ist tatsächlich passiert?</h3>${fld2('happened','Ergebnis')}<h3>Was hast du gelernt?</h3>${fld2('learned','Erkenntnis')}${prev.obstacle?`<label class="row gap" style="margin-top:10px;justify-content:flex-start"><input type="checkbox" ${a.obsDone?'checked':''} onchange="V.coach.a.obsDone=this.checked"> Hindernis „${esc(trunc((tc.obstacles.find(o=>o.id===prev.obstacle)||{}).text||'',40))}“ ist beseitigt</label>`:''}`:'<div class="empty sm">Erster Coaching-Zyklus – es gibt noch keinen vorherigen Schritt. Einfach weiter.</div>';
 if(s.k==='obs')body=`${tc.obstacles.filter(o=>o.status!=='beseitigt').map(o=>`<label class="row gap" style="justify-content:flex-start;padding:8px 0;border-bottom:1px solid var(--bd);flex-wrap:nowrap"><input type="radio" name="cfo" style="width:auto" ${a.focus===o.id?'checked':''} onchange="V.coach.a.focus='${o.id}'"><span>${esc(o.text)}</span></label>`).join('')||'<p class="mut sm">Noch keine Hindernisse erfasst.</p>'}
  <div class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="cob" placeholder="Neues Hindernis"><button class="btn sm" onclick="kAddObs('cob')">＋</button></div>`;
 if(s.k==='next')body=`<h3>Nächster Schritt / Experiment</h3>${fld2('step','Was genau probierst du als Nächstes?')}<h3>Was erwartest du?</h3>${fld2('expect','Erwartetes Ergebnis')}`;
 if(s.k==='when'){const f=tc.obstacles.find(o=>o.id===a.focus);body=`<input type="date" value="${esc(a.when||'')}" onchange="V.coach.a.when=this.value"><h3>Zusammenfassung</h3><div class="card sm" style="margin:0">${prev&&a.happened?`<div><b>Passiert:</b> ${esc(a.happened)}</div>`:''}${a.learned?`<div><b>Gelernt:</b> ${esc(a.learned)}</div>`:''}<div><b>Hindernis:</b> ${f?esc(f.text):'–'}</div><div><b>Nächster Schritt:</b> ${esc(a.step||'–')}</div><div><b>Erwartung:</b> ${esc(a.expect||'–')}</div>${Object.keys(c.m).filter(x=>has(c.m[x])).length?`<div><b>Messwerte:</b> ${tc.metrics.filter(m=>has(c.m[m.id])).map(m=>esc(m.name)+' '+c.m[m.id]).join(', ')}</div>`:''}</div>`}
 return `<div class="cdots">${CQ.map((x,j)=>`<span class="${j===c.step?'on':j<c.step?'ok':''}">${x.n}</span>`).join('')}</div>
 <div class="mut sm">🎓 ${esc(tc.learner||'Lernender')} · ${esc(tc.title)}</div><div class="cq">${s.q}</div><div class="intro" style="margin:0 0 12px"><span>💡 ${s.h}</span></div>${body}
 <div class="row" style="margin-top:16px;flex-wrap:nowrap">${c.step?'<button class="btn" onclick="cGo(-1)">‹ Zurück</button>':''}<span style="flex:1"></span>${c.step<CQ.length-1?'<button class="btn pri" onclick="cGo(1)">Weiter ›</button>':'<button class="btn pri" onclick="cFinish()">✓ Coaching abschließen</button>'}</div>`}
function cFinish(){const p=P(),k=p.kata,c=V.coach,a=c.a,tc=tcById(c.tcId),now=Date.now(),prev=openExp(tc);
 tc.metrics.forEach(m=>{const v=num(c.m[m.id]);if(isFinite(v))tc.meas.push({t:now+Math.random(),date:today(),mid:m.id,val:v})});
 if(prev&&(a.happened||a.learned)){prev.result=a.happened||prev.result;prev.learned=a.learned||prev.learned;prev.done=true;if(a.obsDone&&prev.obstacle){const o=tc.obstacles.find(x=>x.id===prev.obstacle);if(o){o.status='beseitigt';o.focus=false}}}
 if(a.focus){tc.obstacles.forEach(o=>o.focus=o.id===a.focus);const o=tc.obstacles.find(x=>x.id===a.focus);if(o&&o.status==='offen')o.status='in Arbeit'}
 if(a.step&&a.step.trim())tc.exps.push({id:uid(),date:today(),obstacle:a.focus||'',step:a.step.trim(),expect:(a.expect||'').trim(),result:'',learned:'',done:false,t:now});
 if(a.when)tc.nextCoach=a.when;
 k.sessions.push({id:uid(),tcId:tc.id,learner:tc.learner,t:now,answers:{...a,obstacleText:(tc.obstacles.find(o=>o.id===a.focus)||{}).text||''},meas:{...c.m}});
 V.coach=null;save();render();scrollTo(0,0);toast('Coaching-Zyklus gespeichert')}

const R={kata:kataV,prob:probV,talk:talkV,vsm:vsmV,muda:mudaV,time:timeV,spag:spagV,greif:greifV,ishi:ishiV,why:whyV,s5:s5V,act:actV,notes:notesV};
storeTest();persist();load();if(S.last&&S.projects.some(p=>p.id===S.last)){V.pid=S.last;V.view='project'}render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
