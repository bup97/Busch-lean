<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Busch LEAN">
<meta name="theme-color" content="#0f6e56">
<title>Busch LEAN</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#17202a;--mut:#6b7280;--bd:#e2e5ea;--pri:#0f6e56;--pri2:#e3f2ec;--warn:#d97706;--bad:#c62828;--ok:#15803d;--va:#16a34a;--nva:#f59e0b;--w:#dc2626;--inv:#f6c453}
@media (prefers-color-scheme:dark){:root{--bg:#0f1316;--card:#1a2025;--tx:#e8edf1;--mut:#9aa4ad;--bd:#2c343b;--pri:#3fbf95;--pri2:#163229;--inv:#a87d1f}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--card);border-bottom:1px solid var(--bd)}
header h1{flex:1;margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .logo{font-weight:800;color:var(--pri)}
.back,.info{border:0;background:var(--pri2);color:var(--pri);border-radius:10px;min-width:36px;height:36px;font-size:20px;font-weight:700;cursor:pointer}
.info{font-size:13px;padding:0 10px}
main{max-width:860px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 40px)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 2px 8px}
h3{font-size:15px;margin:14px 0 6px}
.hero h1{font-size:24px;line-height:1.2;margin:6px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.card.link,.proj{cursor:pointer}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gap{gap:8px;justify-content:flex-start;flex-wrap:wrap}
.mut{color:var(--mut)}.sm{font-size:12.5px}
.empty{padding:22px;text-align:center;color:var(--mut);border:1.5px dashed var(--bd);border-radius:14px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;-webkit-appearance:none;appearance:none}
textarea{resize:vertical}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:auto;width:20px!important;height:20px;padding:0;accent-color:var(--pri)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
.row input{flex:1}
label.f{display:block}
label.f span{display:block;font-size:12px;color:var(--mut);margin:0 0 3px 2px}
label.f i{font-style:normal;opacity:.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.full{grid-column:1/-1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.wide{width:100%;margin-top:10px}
.btn.del{color:var(--bad)}
.ib{border:0;background:transparent;color:var(--mut);font-size:16px;padding:4px 7px;cursor:pointer;border-radius:8px}
.ib:hover{background:var(--bg)}
.lnk{border:0;background:none;color:var(--pri);font:inherit;font-weight:600;cursor:pointer;padding:0;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:2px 9px}
.chip.c{color:#fff;border:0}
.pcard{position:relative;background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--pc);border-radius:16px;margin-bottom:14px;cursor:pointer;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07);transition:transform .12s}
.pcard:active{transform:scale(.985)}
.ptop{display:flex;align-items:center;gap:12px;padding:14px 14px 10px;background:linear-gradient(90deg,color-mix(in srgb,var(--pc) 14%,transparent),transparent)}
.pav{width:46px;height:46px;flex:none;border-radius:13px;background:var(--pc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.pname{font-size:19px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgo{font-size:28px;color:var(--pc);font-weight:300}
.pbody{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:2px 14px 10px}
.pm .row{white-space:nowrap;font-size:11.5px;color:var(--mut);margin-bottom:3px}.pm b{color:var(--tx);font-size:12.5px}
.pfoot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 14px 12px}
.pcount{background:var(--pri);color:#fff;border-radius:999px;min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:800;padding:0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tile .ic{font-size:24px}
.seg,.tabs{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px;overflow-x:auto}
.seg button,.tabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:8px 6px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button.on,.tabs button.on{background:var(--pri);color:#fff}
.tabs button.on{background:var(--pri2);color:var(--pri)}
.intro{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--pri2);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.kpi span{display:block;font-size:12px;color:var(--mut)}
.kpi b{font-size:20px}.kpi small{font-size:12px;font-weight:500;color:var(--mut)}
.kpi i{display:block;font-size:11px;font-style:normal;color:var(--mut)}
.live{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;top:57px;z-index:3;background:var(--bg);padding:4px 0 8px}
.live div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 8px;text-align:center}
.live span{display:block;font-size:10.5px;color:var(--mut)}.live b{font-size:15px}
.bar{height:9px;background:var(--bg);border-radius:9px;overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden;border:1px solid var(--bd);margin:6px 0}
.stack i{display:block;height:100%}
.prog{margin:8px 0}.prog .row{font-size:13px;margin-bottom:3px}
.chk{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd)}
.chk:last-child{border:0}
.chk b{width:22px;height:22px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;border:1.5px solid var(--bd);color:var(--mut)}
.chk.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:right}
td:first-child,th:first-child{text-align:left}
th{font-size:12px;color:var(--mut);font-weight:600}
.good{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}
.step h3{margin:0;font-size:15px}
.clock{font:700 46px/1 ui-monospace,Menlo,monospace;text-align:center;padding:16px 0 4px}
.cats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.cats button{border:0;border-radius:14px;padding:18px 6px;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.score{display:flex;gap:4px;margin-top:6px}
.score button{flex:1;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:7px 0;font:inherit;font-weight:700;cursor:pointer}
.score button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.q{padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}.q:last-child{border:0}
.act.done .txt{text-decoration:line-through;opacity:.6}
.st{border:0;border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.st.offen{background:#fde2e1;color:#9b1c1c}.st.arbeit{background:#fef3c7;color:#92400e}.st.erledigt{background:#dcfce7;color:#166534}
.over{color:var(--bad);font-weight:700}
.st.neu{background:#dbeafe;color:#1e40af}.st.pruef{background:#fef3c7;color:#92400e}.st.umgesetzt{background:#dcfce7;color:#166534}.st.abgelehnt{background:#e5e7eb;color:#374151}
.btn.on{background:var(--pri2);color:var(--pri);border-color:var(--pri)}
.quote{border-left:3px solid var(--pri);padding:2px 0 2px 9px;margin:6px 0;font-style:italic;font-size:14px}
.lvl{letter-spacing:1px;color:var(--bad)}
.note{white-space:pre-wrap}
.tip{background:var(--pri2);border-radius:10px;padding:10px;margin-top:10px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px)}
.sheet h2{font-size:19px;text-transform:none;letter-spacing:0;color:var(--tx);margin:0 0 6px}
.sheet ol{padding-left:20px}.sheet li{margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--tx);color:var(--card);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
details summary{cursor:pointer;font-weight:600}
svg text{fill:var(--tx);font-size:10.5px;font-family:inherit}
svg{color:var(--tx)}
svg .b{font-weight:700;font-size:11.5px}
svg .sm{font-size:9.5px;fill:var(--mut)}
.vsm .bx{fill:var(--card);stroke:var(--tx);stroke-width:1.3}
.vsm .bx.bad{stroke:var(--bad);stroke-width:2.4}
.vsm .db{fill:var(--bg);stroke:var(--bd)}
.vsm .tri{fill:var(--inv);stroke:var(--tx);stroke-width:1}
.vsm .info{fill:none;stroke:var(--mut);stroke-dasharray:5 4;stroke-width:1.3}
.vsm .mat{fill:none;stroke:var(--tx);stroke-width:1.6}
.vsm .tl{fill:none;stroke:var(--pri);stroke-width:2}
.vsm .fac{fill:var(--card);stroke:var(--tx);stroke-width:1.3}
.vsm .flow{font-weight:700;font-size:9.5px;fill:var(--pri)}
.vsm .sum{fill:var(--pri2);stroke:var(--pri)}
.chart .bok{fill:var(--pri)}.chart .bbad{fill:var(--bad)}
.chart .takt{stroke:var(--bad);stroke-dasharray:6 4;stroke-width:2}
.chart .tk{fill:var(--bad);font-weight:700}
.chart .ax{stroke:var(--bd)}
.fish .spine{stroke:var(--tx);stroke-width:3}
.fish .bone{stroke:var(--tx);stroke-width:1.6}
.fish .twig{stroke:var(--mut)}
.fish .head{fill:var(--pri2);stroke:var(--pri);stroke-width:1.5}
.fish .cat{font-weight:700;font-size:12.5px;fill:var(--pri)}
.fish .cz{font-size:9.5px}.fish .mainc{font-size:9.5px;font-weight:700;fill:var(--bad)}
.radar .rg{fill:none;stroke:var(--bd)}
.radar .rv{fill:rgba(15,110,86,.25);stroke:var(--pri);stroke-width:2}
.radar text{font-size:10px}
.spag{background:var(--card);border-radius:10px;touch-action:manipulation;width:100%;height:auto;display:block}
.spag .gl{stroke:var(--bd);stroke-width:.6}
.spag .path{fill:none;stroke:var(--w);stroke-width:2;stroke-linejoin:round;opacity:.85}
.spag .sta{fill:var(--pri2);stroke:var(--pri)}
.zone text{font-size:11px;font-weight:700}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="app"></main>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeM()"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>
<script>
/* ===== Grundlagen ===== */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:NaN};
const has=v=>v!==''&&v!=null&&isFinite(num(v));
const fmt=(n,d=1)=>isFinite(n)?n.toLocaleString('de-DE',{maximumFractionDigits:d}):'–';
const trunc=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s};
const today=()=>new Date().toISOString().slice(0,10);
const fmtT=s=>{const m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+(s%60).toFixed(1).padStart(4,'0')};
const pct=(a,b)=>b?a/b*100:0;
const bar=(p,c)=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p||0))}%;${c?'background:'+c:''}"></i></div>`;
const opt=(v,l,cur)=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(l)}</option>`;
const ARROW='<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>';

const KEY='buschlean_v2';
let S;
let STORE_OK=true;
function storeTest(){try{localStorage.setItem('bl_test','1');STORE_OK=localStorage.getItem('bl_test')==='1';localStorage.removeItem('bl_test')}catch(e){STORE_OK=false}}
function persist(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}if(!S||!Array.isArray(S.projects))S={projects:[]};S.projects.forEach(fix)}
function save(){try{S.last=V.pid||S.last||null;if(V.view!=='home'&&P())P().updated=Date.now();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){STORE_OK=false;toast('⚠️ Speichern nicht möglich')}}
let V={view:'home',pid:null,tool:null,vv:'ist',vt:'daten',af:'offen',sm:'weg',aid:null,tRun:null,tLast:null,lst:'',live:null};
const P=()=>S.projects.find(p=>p.id===V.pid);

const newVsm=()=>({customer:{name:'',demand:'',shiftMin:'',shifts:'',breakMin:'',delivery:''},supplier:{name:'',delivery:''},info:{planning:'',custOrder:'',suppOrder:'',control:''},fg:'',steps:[]});
const newStep=()=>({id:uid(),name:'',ct:'',co:'',avail:'',ops:'',par:'1',lot:'',scrap:'',inv:'',flow:'push'});
const newProject=name=>({id:uid(),name,desc:'',created:Date.now(),vsm:{ist:newVsm(),soll:newVsm()},muda:{obs:[],laps:[]},spag:{pts:[],st:[],scale:'1',cycles:''},greif:[],talks:[],ishi:{problem:'',causes:[]},whys:[],audits:[],actions:[],notes:[]});
function fix(p){const d=newProject(p.name);for(const k in d)if(p[k]==null)p[k]=d[k];if(!p.spag.st)p.spag.st=[];if(!p.muda.laps)p.muda.laps=[];}

function upd(path,val){let o=P();const k=path.split('.');for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=val;save();if(V.live)V.live()}
function upr(path,val){upd(path,val);render()}
function fld(label,path,val,o={}){return `<label class="f${o.cls?' '+o.cls:''}"><span>${label}${o.unit?` <i>(${o.unit})</i>`:''}</span><input ${o.num?'inputmode="decimal"':''} type="${o.type||'text'}" value="${esc(val)}" placeholder="${esc(o.ph||'')}" oninput="upd('${path}',this.value)"></label>`}
function area(label,path,val,ph,rows=3){return `<label class="f"><span>${label}</span><textarea rows="${rows}" placeholder="${esc(ph||'')}" oninput="upd('${path}',this.value)">${esc(val)}</textarea></label>`}

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)}
function modal(h){$('#sheet').innerHTML=h;$('#modal').classList.remove('hidden')}
function closeM(){$('#modal').classList.add('hidden')}

/* ===== Werkzeuge + Kurzanleitungen ===== */
const TOOLS={
vsm:{name:'Wertstrom',icon:'🗺️',short:'Material- und Informationsfluss vom Lieferanten bis zum Kunden – Ist- und Soll-Zustand mit Kennzahlen.',
 guide:{why:'Die Wertstromanalyse zeigt den gesamten Fluss einer Produktfamilie vom Lieferanten bis zum Kunden. Sie macht Bestände, Wartezeiten und Engpässe sichtbar und zeigt, wie viel der Durchlaufzeit wirklich wertschöpfend ist. Im Wertstromdesign (Soll) planst du daraus den verbesserten Fluss.',
 steps:['Produktfamilie festlegen: Produkte mit ähnlichen Prozessschritten zusammenfassen.','Beim Kunden starten: Tagesbedarf, Schichtmodell und Pausen eintragen – daraus ergibt sich der Kundentakt.','Den Prozess vor Ort ablaufen (am besten vom Versand rückwärts) und jeden Schritt mit Zykluszeit, Rüstzeit, Verfügbarkeit, Mitarbeitern, parallelen Plätzen und Losgröße erfassen.','Bestände vor jedem Schritt und im Fertigwarenlager zählen – die App rechnet sie in Reichweite (Arbeitstage) um.','Informationsfluss ergänzen: Wie kommen Kundenbestellung, Planung und Lieferantenabruf zustande? Wie wird zwischen den Schritten gesteuert (Push, FIFO, Supermarkt)?','In der Checkliste prüfen, ob alles vollständig ist, dann Karte und Kennzahlen auswerten.','Soll-Zustand anlegen („aus Ist übernehmen“) und Verbesserungen eintragen. Der Vergleich Ist ↔ Soll zeigt den Fortschritt, die Umsetzung läuft über den Maßnahmenplan.'],
 tip:'Zeiten selbst vor Ort messen statt aus dem System zu übernehmen. Rote Prozesskästen bedeuten: effektive Zykluszeit liegt über dem Kundentakt.'}},
muda:{name:'Verschwendung',icon:'🔍',short:'Die 8 Verschwendungsarten vor Ort beobachten, bewerten und abstellen.',
 guide:{why:'Verschwendung ist alles, was Zeit oder Ressourcen kostet, ohne dass der Kunde dafür zahlt. Mit der Muda-Aufnahme dokumentierst du direkt am Arbeitsplatz, wo welche Verschwendung auftritt und wie viel Zeit sie pro Schicht kostet.',
 steps:['Bereich und Zeitraum festlegen, Mitarbeiter vorher informieren.','Am Arbeitsplatz beobachten – nicht eingreifen.','Jede Verschwendung mit Art, Station und kurzer Beschreibung erfassen.','Dauer pro Vorkommen (Sekunden) und Häufigkeit pro Schicht schätzen oder messen.','Auswertung ansehen: Die größten Blöcke zuerst angehen.','Ideen direkt mit „→ Maßnahme“ in den Maßnahmenplan übernehmen.'],
 tip:'Merkhilfe TIMWOODS: Transport, Inventory (Bestände), Motion (Bewegung), Waiting, Overproduction, Overprocessing, Defects, Skills.'}},
time:{name:'Zeitaufnahme',icon:'⏱️',short:'Arbeitsabläufe stoppen und in wertschöpfend, notwendig und Verschwendung einteilen.',
 guide:{why:'Die Zeitaufnahme zeigt, wie sich die Arbeitszeit am Platz zusammensetzt. Nur der wertschöpfende Anteil verändert das Produkt so, wie es der Kunde will – der Rest ist Ansatzpunkt für Verbesserungen.',
 steps:['Station eintragen und Stoppuhr starten.','Optional eine Bezeichnung für den Abschnitt eingeben (z. B. „Schrauben holen“).','Am Ende jedes Abschnitts die passende Kategorie tippen: Grün = wertschöpfend (verändert das Produkt), Gelb = nicht wertschöpfend, aber notwendig (Prüfen, Scannen), Rot = Verschwendung (Suchen, Warten, Laufen).','Die Uhr läuft automatisch für den nächsten Abschnitt weiter.','Mehrere Zyklen aufnehmen und die Anteile auswerten.'],
 tip:'Mindestens 5–10 Zyklen aufnehmen. Ausreißer nicht löschen, sondern notieren – sie zeigen Störungen.'}},
spag:{name:'Spaghetti-Diagramm',icon:'🍝',short:'Laufwege aufzeichnen und Distanzen pro Zyklus und Schicht berechnen.',
 guide:{why:'Das Spaghetti-Diagramm macht die Wege von Mitarbeitern oder Material sichtbar. Viele Kreuzungen und lange Strecken zeigen Bewegungs- und Transportverschwendung und sind der Ansatz für ein besseres Layout.',
 steps:['Maßstab festlegen: Wie viele Meter entspricht ein Kästchen?','Im Modus „Station“ Arbeitsplätze, Regale und Lager setzen und benennen.','Im Modus „Weg“ der Reihe nach die Punkte antippen, die der Mitarbeiter in einem Zyklus abläuft.','Zyklen pro Schicht eintragen – die App rechnet die Laufstrecke und Gehzeit hoch.','Im Soll das Layout neu denken: Material zum Mitarbeiter bringen, nicht umgekehrt.'],
 tip:'Einen kompletten Zyklus mitlaufen. Jeder Weg zählt – auch der zum Drucker oder zur Schublade.'}},
greif:{name:'Greifraumanalyse',icon:'✋',short:'Griffe nach Greifzonen bewerten – Ergonomie und Bewegungsverschwendung.',
 guide:{why:'Die Greifraumanalyse prüft, ob Teile und Werkzeuge im optimalen Greifraum liegen. Jeder Griff außerhalb kostet Zeit und belastet den Körper.',
 steps:['Für jedes Teil bzw. Werkzeug am Platz einen Eintrag anlegen.','Greifzone wählen: A = Unterarm, Ellbogen am Körper · B = ausgestreckter Arm · C = Rumpf beugen oder drehen · D = Schritt nötig.','Anzahl Griffe pro Zyklus eintragen.','Auswertung: Häufige Griffe gehören in Zone A, C und D sollten verschwinden.','Verbesserungen (Teil näher, Schrägregal, Greifschale) als Maßnahme übernehmen.'],
 tip:'Häufigkeit schlägt Entfernung: Ein Teil, das 20× pro Zyklus gegriffen wird, gehört direkt vor den Mitarbeiter.'}},
ishi:{name:'Ishikawa',icon:'🐟',short:'Mögliche Ursachen eines Problems strukturiert nach den 6M sammeln.',
 guide:{why:'Das Ishikawa- oder Fischgrätendiagramm hilft im Team, alle möglichen Ursachen eines Problems zu sammeln und zu ordnen, statt vorschnell eine Lösung zu wählen.',
 steps:['Problem klar und messbar formulieren (Kopf des Fisches).','Ursachen den 6M zuordnen: Mensch, Maschine, Methode, Material, Milieu (Umwelt), Messung.','Erst sammeln, dann bewerten – beim Brainstorming nicht diskutieren.','Wahrscheinlichste Ursachen mit ★ markieren.','Hauptursachen mit 5-Why vertiefen und mit Daten bestätigen.'],
 tip:'Mit dem Team direkt vor Ort machen – die Mitarbeiter am Prozess kennen die Ursachen am besten.'}},
why:{name:'5-Why',icon:'❓',short:'Durch wiederholtes Nachfragen von Symptom zur Grundursache.',
 guide:{why:'Mit der 5-Why-Methode gehst du von einem Symptom zur eigentlichen Ursache. So wird das Problem nachhaltig gelöst und nicht nur das Symptom behandelt.',
 steps:['Problem konkret beschreiben (Was, Wo, Wann, Wie viel?).','Fragen: Warum ist das passiert? Antwort eintragen.','Auf jede Antwort erneut „Warum?“ fragen – bis zu fünfmal oder bis eine beeinflussbare Ursache erreicht ist.','Grundursache festhalten.','Gegenmaßnahme ableiten und in den Maßnahmenplan übernehmen.'],
 tip:'Gegenprobe: Die Kette rückwärts mit „deshalb“ lesen. Nie bei „Mitarbeiter hat Fehler gemacht“ stehen bleiben – frag, warum der Fehler möglich war.'}},
s5:{name:'5S-Audit',icon:'🧹',short:'Ordnung und Sauberkeit am Arbeitsplatz bewerten und den Verlauf verfolgen.',
 guide:{why:'5S schafft die Basis für stabile Prozesse: Sortieren, Systematisieren, Säubern, Standardisieren, Selbstdisziplin. Mit regelmäßigen Audits wird der Stand messbar.',
 steps:['Neues Audit anlegen und Bereich eintragen.','Jede Frage vor Ort bewerten: 0 = nicht erfüllt … 4 = vollständig erfüllt.','Das Netzdiagramm zeigt Stärken und Schwächen je S.','Abweichungen als Maßnahmen übernehmen.','Audit regelmäßig wiederholen (z. B. monatlich) und den Verlauf beobachten.'],
 tip:'Vorher-/Nachher-Fotos sind die beste Motivation fürs Team.'}},
act:{name:'Maßnahmenplan',icon:'✅',short:'Alle Maßnahmen mit Verantwortlichem, Termin und Status an einem Ort.',
 guide:{why:'Der Maßnahmenplan sammelt alle Verbesserungen aus den Werkzeugen und sorgt dafür, dass sie umgesetzt werden. Er ist die Grundlage für die Fortschrittskennzahlen.',
 steps:['Maßnahme konkret formulieren (Was genau wird geändert?).','Verantwortlichen und Termin festlegen.','Status antippen, um ihn weiterzuschalten: offen → in Arbeit → erledigt.','Überfällige Maßnahmen sind rot markiert.','Regelmäßig im Team durchgehen, z. B. in der Shopfloor-Runde.'],
 tip:'Eine Maßnahme ohne Namen und Termin ist nur eine Idee.'}},
talk:{name:'Mitarbeitergespräche',icon:'💬',short:'Ideen, Ärgernisse und Belastungen aus Gesprächen mit Mitarbeitern dokumentieren und bis zur Rückmeldung verfolgen.',
 guide:{why:'Die Mitarbeiter am Prozess kennen die Probleme am besten. In gezielten Gesprächen kommen Verbesserungsideen und Belastungen ans Licht, die in keiner Messung auftauchen. Entscheidend ist, dass jedes Anliegen verfolgt und dem Mitarbeiter zurückgemeldet wird – sonst sagt beim nächsten Mal niemand mehr etwas.',
 steps:['Gespräch am Arbeitsplatz führen und das Ziel erklären: Es geht um den Prozess, nicht um die Bewertung der Person.','Mit den Leitfragen ins Gespräch kommen (im Werkzeug aufklappbar) – zuhören, nicht rechtfertigen.','Pro Anliegen einen Eintrag anlegen: Art (Idee, Ärgernis/Belastung, Läuft gut), Thema, Station, Beschreibung und gern ein wörtliches Zitat.','Belastung bzw. Dringlichkeit von 1 bis 5 gemeinsam mit dem Mitarbeiter einschätzen.','Status antippen, um ihn weiterzuschalten: neu → in Prüfung → umgesetzt → abgelehnt. Umsetzbares direkt mit „→ Maßnahme“ übernehmen.','Dem Mitarbeiter Rückmeldung geben und abhaken – auch bei einer Ablehnung, dann mit Begründung.'],
 tip:'Namen nur mit Einverständnis notieren, im Zweifel „anonym“ wählen. Die Daten liegen nur auf deinem Gerät – beim Export und Weitergeben an Datenschutz und ggf. Betriebsrat denken.'}},
notes:{name:'Notizen',icon:'📝',short:'Beobachtungen, Gesprächsnotizen und Ideen zum Projekt.',
 guide:{why:'Hier sammelst du alles, was nicht in ein Werkzeug passt oder was du schnell festhalten willst.',
 steps:['Notiz schreiben und optional einem Werkzeug zuordnen.','Zugeordnete Notizen erscheinen auch direkt im jeweiligen Werkzeug.'],tip:''}}
};

['Systematisieren',['Jeder Gegenstand hat einen festen, gekennzeichneten Platz','Werkzeuge in Griffweite, nach Nutzung angeordnet','Boden- und Lagerplatzmarkierungen vorhanden','Mindest-/Maximalbestände sichtbar']],
['Säubern',['Arbeitsplatz und Boden sauber','Vorrichtungen/Maschinen sauber, Schmutzquellen bekannt','Reinigungsplan vorhanden und gepflegt','Reinigungsmittel verfügbar']],
['Standardisieren',['Standards visualisiert (Fotos, Arbeitsanweisungen)','Abweichungen auf einen Blick erkennbar','Verantwortlichkeiten festgelegt','Standards sind aktuell']],
['Selbstdisziplin',['Standards werden eingehalten','Audits finden regelmäßig statt','Maßnahmen aus dem letzten Audit umgesetzt','Mitarbeiter kennen die 5S-Ziele']]];

/* ===== Navigation ===== */
function go(v){V.view=v;render();window.scrollTo(0,0)}
function openP(id){V.pid=id;save();go('project')}
function openT(id){V.tool=id;go('tool')}
function guide(id){const t=TOOLS[id],g=t.guide;modal(`<h2>${t.icon} ${t.name}</h2><h3>Wofür?</h3><p>${g.why}</p><h3>So geht's</h3><ol>${g.steps.map(s=>`<li>${s}</li>`).join('')}</ol>${g.tip?`<div class="tip">💡 ${g.tip}</div>`:''}<button class="btn pri wide" onclick="closeM()">Verstanden</button>`)}
const intro=id=>`<div class="intro"><span>${TOOLS[id].short}</span><button class="lnk" onclick="guide('${id}')">Anleitung</button></div>`;
function hdr(title,back,tool){return `${back?`<button class="back" onclick="${back}">‹</button>`:''}<h1>${title}</h1>${tool?`<button class="info" onclick="guide('${tool}')">ⓘ Anleitung</button>`:''}`}

function render(){
 V.live=null;const h=$('#hdr'),a=$('#app');
 if(V.view==='project'&&!P())V.view='home';
 if(V.view==='home'){h.innerHTML=hdr('<span class="logo">Busch</span> LEAN');a.innerHTML=homeV()}
 else if(V.view==='lib'){h.innerHTML=hdr('Werkzeuge & Anleitungen',"go('home')");a.innerHTML=libV()}
 else if(V.view==='project'){h.innerHTML=hdr(esc(P().name),"go('home')");a.innerHTML=projectV(P())}
 else if(V.view==='tool'){const p=P();if(!p)return go('home');const t=TOOLS[V.tool];h.innerHTML=hdr(t.icon+' '+t.name,"go('project')",V.tool);a.innerHTML=R[V.tool](p)}
}

/* ===== Startseite & Projekt ===== */
function projStats(p){const t=p.actions.length,d=p.actions.filter(a=>a.status==='erledigt').length;return{compl:vcomp(p.vsm.ist),total:t,done:d}}
const PCOL=['#0f6e56','#2563eb','#7c3aed','#d97706','#db2777','#0891b2','#65a30d','#475569'];
const pcol=p=>{let h=0;for(const c of p.id)h=(h*31+c.charCodeAt(0))>>>0;return PCOL[h%PCOL.length]};
const ago=t=>{if(!t)return '';const d=(Date.now()-t)/864e5;if(d<1/24)return 'gerade eben';if(d<1)return 'heute';if(d<2)return 'gestern';if(d<7)return `vor ${Math.floor(d)} Tagen`;return new Date(t).toLocaleDateString('de-DE')};
function projCard(p){
 const k=projStats(p),c=pcol(p),td=today(),ci=vcalc(p.vsm.ist),sc=vcomp(p.vsm.soll);
 const openA=p.actions.filter(a=>a.status!=='erledigt').length,late=p.actions.filter(a=>a.status!=='erledigt'&&a.due&&a.due<td).length,openT=(p.talks||[]).filter(t=>t.status==='neu'||t.status==='in Prüfung').length;
 const mini=(l,v,pc)=>`<div class="pm"><div class="row"><span>${l}</span><b>${v}</b></div>${bar(pc,c)}</div>`;
 const ini=p.name.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
 return `<div class="pcard" style="--pc:${c}" onclick="openP('${p.id}')">
 <div class="ptop"><div class="pav">${esc(ini)}</div><div style="flex:1;min-width:0"><div class="pname">${esc(p.name)}</div><div class="psub">${p.desc?esc(trunc(p.desc,70)):'Zuletzt bearbeitet '+ago(p.updated||p.created)}</div></div><div class="pgo">›</div></div>
 <div class="pbody">${mini('Ist',k.compl+' %',k.compl)}${mini('Soll',sc+' %',sc)}${mini('Maßnahmen',k.done+'/'+k.total,pct(k.done,k.total))}</div>
 <div class="pfoot">${isFinite(ci.invDays)?`<span class="chip">⏳ DLZ ${fmt(ci.invDays,1)} AT</span>`:''}${openA?`<span class="chip">✅ ${openA} offen</span>`:''}${late?`<span class="chip c" style="background:var(--bad)">⚠️ ${late} überfällig</span>`:''}${openT?`<span class="chip">💬 ${openT} Anliegen</span>`:''}${p.muda.obs.length?`<span class="chip">🔍 ${p.muda.obs.length}</span>`:''}${p.desc?`<span class="mut sm" style="margin-left:auto">${ago(p.updated||p.created)}</span>`:''}</div></div>`;
}
function homeV(){
 const ps=S.projects.slice().sort((a,b)=>(b.updated||b.created)-(a.updated||a.created));
 const warn=STORE_OK?'':`<div class="card" style="border-color:var(--bad);background:#fde2e1;color:#7f1d1d"><b>⚠️ Dieser Browser speichert nichts dauerhaft.</b><div class="sm" style="margin-top:4px">Alles, was du hier anlegst, ist beim Schließen weg. Öffne die App über <b>bup97.github.io/Busch-lean</b> in Safari (nicht im privaten Modus) oder über das Symbol auf dem Home-Bildschirm.</div></div>`;
 const add=`<div class="row gap" style="flex-wrap:nowrap;margin-top:12px"><input id="np" placeholder="Neues Projekt, z. B. Endmontage" onkeydown="if(event.key==='Enter')addP()"><button class="btn pri" onclick="addP()">＋ Anlegen</button></div>`;
 const head=ps.length?`<div class="row" style="margin:6px 2px 12px"><div><div style="font-size:24px;font-weight:800;line-height:1.15">Meine Projekte</div></div><span class="pcount">${ps.length}</span></div>`
  :`<section class="hero"><h1>Prozesse analysieren.<br>Verschwendung sichtbar machen.</h1><p class="mut">Alle Lean-Werkzeuge pro Projekt – jeweils mit Kurzanleitung. Lege unten dein erstes Projekt an.</p></section>`;
 return warn+head+ps.map(projCard).join('')+add+`
 <h2>Mehr</h2><div class="card link row" onclick="go('lib')"><span>📘 Lean-Werkzeuge & Kurzanleitungen</span><span class="mut">›</span></div>
 <div class="card"><b>Datensicherung</b><p class="mut sm" style="margin:4px 0 10px">Die Daten liegen nur auf diesem Gerät. Exportiere regelmäßig eine Sicherung.</p><div class="row gap"><button class="btn sm" onclick="exportData()">⬇︎ Exportieren</button><label class="btn sm">⬆︎ Importieren<input type="file" accept="application/json,.json" hidden onchange="importData(this)"></label></div></div>`;
}
function libV(){return ORDER.map(id=>{const t=TOOLS[id];return `<div class="card link" onclick="guide('${id}')"><div class="row"><b>${t.icon} ${t.name}</b><span class="lnk">Anleitung ›</span></div><div class="mut sm">${t.short}</div></div>`}).join('')}
function addP(){const e=$('#np'),n=e.value.trim();if(!n){e.focus();return}const p=newProject(n);S.projects.push(p);save();openP(p.id)}
function delP(){const p=P();if(!confirm(`Projekt „${p.name}“ mit allen Daten löschen?`))return;S.projects=S.projects.filter(x=>x!==p);save();go('home')}
function exportData(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`busch-lean-sicherung-${today()}.json`;document.body.appendChild(a);a.click();a.remove()}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.projects))throw 0;if(!confirm('Vorhandene Daten durch die Sicherung ersetzen?'))return;S=d;S.projects.forEach(fix);save();render();toast('Sicherung importiert')}catch(e){alert('Datei ist keine gültige Busch-LEAN-Sicherung.')}};r.readAsText(f)}

const STAT={vsm:p=>`Ist ${vcomp(p.vsm.ist)}% · Soll ${vcomp(p.vsm.soll)}%`,muda:p=>`${p.muda.obs.length} Beobachtungen`,time:p=>`${p.muda.laps.length} Abschnitte`,spag:p=>`${fmt(spagDist(p.spag),0)} m je Zyklus`,greif:p=>`${p.greif.length} Teile`,ishi:p=>`${p.ishi.causes.length} Ursachen`,why:p=>`${p.whys.length} Analysen`,s5:p=>{const a=p.audits[p.audits.length-1];return a?`Letztes: ${fmt(s5calc(a).total,0)}%`:'Noch kein Audit'},act:p=>`${p.actions.filter(a=>a.status==='erledigt').length}/${p.actions.length} erledigt`,notes:p=>`${p.notes.length} Notizen`,talk:p=>`${p.talks.filter(t=>t.status==='neu'||t.status==='in Prüfung').length} offen · ${p.talks.length} gesamt`};

function projectV(p){
 const ci=vcalc(p.vsm.ist),cs=vcalc(p.vsm.soll),k=projStats(p),sollC=vcomp(p.vsm.soll);
 const dlzRed=isFinite(ci.invDays)&&ci.invDays>0&&isFinite(cs.invDays)&&cs.invDays>0?(1-cs.invDays/ci.invDays)*100:NaN;
 const kp=(l,a,b,u,d)=>`<div class="kpi"><span>${l}</span><b>${a}<small> ${u}</small></b><i>Soll: ${b} ${u}</i></div>`;
 return `<div class="card">${fld('Projektname','name',p.name)}<div style="height:8px"></div>${area('Beschreibung / Ziel','desc',p.desc,'z. B. Durchlaufzeit Endmontage um 30 % senken',2)}</div>
 <h2>Ergebniskennzahlen (Ist)</h2><div class="kpis">${kp('Durchlaufzeit',fmt(ci.invDays,1),fmt(cs.invDays,1),'AT')}${kp('Flussgrad',fmt(ci.flow,2),fmt(cs.flow,2),'%')}${kp('Bestand',fmt(ci.invPcs,0),fmt(cs.invPcs,0),'Stk')}${kp('Kundentakt',fmt(ci.takt,1),fmt(cs.takt,1),'s')}</div>
 <h2>Fortschritt</h2><div class="card">
  ${progRow('Ist-Aufnahme vollständig',k.compl+' %',k.compl)}
  ${progRow('Soll-Zustand definiert',sollC+' %',sollC)}
  ${progRow('Maßnahmen umgesetzt',`${k.done} / ${k.total}`,pct(k.done,k.total))}
  ${isFinite(dlzRed)?`<p class="sm" style="margin:8px 0 0">Geplante DLZ-Reduktion Ist → Soll: <b class="${dlzRed>0?'good':'badc'}">${fmt(dlzRed,0)} %</b></p>`:''}
 </div>
 <h2>Werkzeuge</h2><div class="tiles">${ORDER.map(id=>{const t=TOOLS[id];return `<div class="tile" onclick="openT('${id}')"><div class="ic">${t.icon}</div><b>${t.name}</b><span class="mut sm">${STAT[id](p)}</span></div>`}).join('')}</div>
 <div style="margin-top:24px"><button class="btn del sm" onclick="delP()">Projekt löschen</button></div>`;
}
const progRow=(l,v,p)=>`<div class="prog"><div class="row"><span>${l}</span><b>${v}</b></div>${bar(p)}</div>`;

/* ===== Notizen (auch pro Werkzeug) ===== */
function noteCard(p,n){return `<div class="card"><div class="row"><span class="mut sm">${new Date(n.t).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'})}${n.tag&&TOOLS[n.tag]?' · '+TOOLS[n.tag].icon+' '+TOOLS[n.tag].name:''}</span><button class="ib" onclick="delNote('${n.id}')">✕</button></div><div class="note">${esc(n.text)}</div></div>`}
function notesBox(p,tool){const ns=p.notes.filter(n=>n.tag===tool).sort((a,b)=>b.t-a.t);return `<h2>Notizen</h2><div class="card"><textarea id="nb" rows="2" placeholder="Notiz zu ${TOOLS[tool].name}…"></textarea><div style="margin-top:8px"><button class="btn sm" onclick="addNote('${tool}','nb')">+ Notiz hinzufügen</button></div></div>${ns.map(n=>noteCard(p,n)).join('')}`}
function addNote(tag,el){const e=document.getElementById(el),t=e.value.trim();if(!t)return;P().notes.push({id:uid(),text:t,tag:tag||'',t:Date.now()});save();render();toast('Notiz gespeichert')}
function delNote(id){if(!confirm('Notiz löschen?'))return;const p=P();p.notes=p.notes.filter(n=>n.id!==id);save();render()}
function notesV(p){const ns=p.notes.slice().sort((a,b)=>b.t-a.t);return intro('notes')+`<div class="card"><textarea id="nt" rows="4" placeholder="Beobachtung, Idee, Gesprächsnotiz…"></textarea><div class="row" style="margin-top:8px"><select id="ng" style="flex:1">${opt('','Allgemein','')}${ORDER.filter(x=>x!=='notes').map(id=>opt(id,TOOLS[id].name,'')).join('')}</select><button class="btn pri" onclick="addNote(document.getElementById('ng').value,'nt')">Speichern</button></div></div>${ns.map(n=>noteCard(p,n)).join('')||'<div class="empty">Noch keine Notizen.</div>'}`}

/* ===== Maßnahmen ===== */
function addAction(text,src){if(!text||!String(text).trim()){toast('Kein Text für die Maßnahme');return}P().actions.push({id:uid(),text:String(text).trim(),who:'',due:'',status:'offen',src:src||'',created:Date.now()});save();toast('Als Maßnahme übernommen')}
const ST_NEXT={offen:'in Arbeit','in Arbeit':'erledigt',erledigt:'offen'};
function cycleSt(id){const a=P().actions.find(x=>x.id===id);a.status=ST_NEXT[a.status]||'offen';save();render()}
function delAct(id){if(!confirm('Maßnahme löschen?'))return;const p=P();p.actions=p.actions.filter(a=>a.id!==id);save();render()}
function newAct(){const t=$('#at').value.trim();if(!t){$('#at').focus();return}P().actions.push({id:uid(),text:t,who:$('#aw').value.trim(),due:$('#ad').value,status:'offen',src:'',created:Date.now()});save();render()}
function actV(p){
 const order={offen:0,'in Arbeit':1,erledigt:2},td=today();
 const all=p.actions,done=all.filter(a=>a.status==='erledigt').length,over=all.filter(a=>a.status!=='erledigt'&&a.due&&a.due<td).length;
 let list=all.slice();if(V.af==='offen')list=list.filter(a=>a.status!=='erledigt');if(V.af==='erledigt')list=list.filter(a=>a.status==='erledigt');
 list.sort((a,b)=>order[a.status]-order[b.status]||(a.due||'9').localeCompare(b.due||'9'));
 return intro('act')+`<div class="card">${progRow('Umsetzungsgrad',`${done} / ${all.length}`,pct(done,all.length))}${over?`<p class="sm over" style="margin:6px 0 0">${over} Maßnahme(n) überfällig</p>`:''}</div>
 <div class="card"><input id="at" placeholder="Was wird gemacht?"><div class="grid2" style="margin-top:8px"><input id="aw" placeholder="Wer?"><input id="ad" type="date"></div><button class="btn pri wide" onclick="newAct()">+ Maßnahme anlegen</button></div>
 <div class="seg">${[['offen','Offen'],['alle','Alle'],['erledigt','Erledigt']].map(([k,l])=>`<button class="${V.af===k?'on':''}" onclick="V.af='${k}';render()">${l}</button>`).join('')}</div>

function vcalc(v){
 const c=v.customer,d=num(c.demand),sm=num(c.shiftMin),sh=num(c.shifts),br=num(c.breakMin)||0;
 const avail=sh*(sm-br)*60,takt=avail/d;
 const steps=v.steps.map(s=>{const ct=num(s.ct),par=num(s.par)||1,av=(num(s.avail)||100)/100,eff=ct/par,days=num(s.inv)/d;return{...s,ctN:ct,eff,days,util:eff*d/(avail*av)*100,over:isFinite(takt)&&eff>takt}});
 const fgDays=num(v.fg)/d;
 const invDays=steps.reduce((a,s)=>a+(isFinite(s.days)?s.days:0),0)+(isFinite(fgDays)?fgDays:0);
 const bz=steps.reduce((a,s)=>a+(isFinite(s.ctN)?s.ctN:0),0);
 const dlzS=invDays*avail+bz,flow=bz>0&&isFinite(dlzS)&&dlzS>0?bz/dlzS*100:NaN;
 const bottleneck=steps.reduce((m,s)=>isFinite(s.eff)&&(!m||s.eff>m.eff)?s:m,null);
 const ops=steps.reduce((a,s)=>a+(num(s.ops)||0),0);
 const invPcs=steps.reduce((a,s)=>a+(num(s.inv)||0),0)+(num(v.fg)||0);
 return{d,avail,takt,steps,fgDays,invDays:steps.length||has(v.fg)?invDays:NaN,bz,flow,bottleneck,ops,opsTheo:bz/takt,invPcs};
}
function vchecks(v){
 const c=v.customer,st=v.steps,all=f=>st.length>0&&st.every(f),t=x=>!!String(x||'').trim();
 return [
 ['Kunde benannt',t(c.name),'Wer erhält das Produkt (extern oder Folgeprozess)?'],
 ['Kundenbedarf pro Tag',has(c.demand),'Stück pro Arbeitstag – Basis für den Kundentakt'],
 ['Schichtdauer & Anzahl Schichten',has(c.shiftMin)&&has(c.shifts),'Ergibt mit den Pausen die verfügbare Zeit'],
 ['Pausen je Schicht',has(c.breakMin),'0 eintragen, wenn keine Pausen abgezogen werden'],
 ['Lieferfrequenz zum Kunden',t(c.delivery),'z. B. 1× täglich per LKW'],
 ['Lieferant & Anlieferfrequenz',t(v.supplier.name)&&t(v.supplier.delivery),'Hauptlieferant bzw. Wareneingang'],
 ['Mindestens 2 Prozessschritte',st.length>=2,'Ein Prozesskasten pro Schritt mit durchgehendem Fluss'],
 ['Zykluszeit je Schritt',all(s=>has(s.ct)),'Selbst gemessen, in Sekunden pro Stück'],
 ['Rüstzeit je Schritt',all(s=>has(s.co)),'0 eintragen, wenn nicht gerüstet wird'],
 ['Verfügbarkeit je Schritt',all(s=>has(s.avail)),'Anteil der Zeit, in der der Schritt produzieren kann'],
 ['Mitarbeiter je Schritt',all(s=>has(s.ops)),''],
 ['Losgröße je Schritt',all(s=>has(s.lot)),''],
 ['Ausschuss/Nacharbeit je Schritt',all(s=>has(s.scrap)),'in %, 0 wenn keiner'],
 ['Bestand vor jedem Schritt',all(s=>has(s.inv)),'Gezählt, in Stück'],
 ['Fertigwarenbestand',has(v.fg),'Bestand vor Versand / beim Kunden'],
 ['Produktionsplanung',t(v.info.planning),'Wie wird geplant? (z. B. SAP, Excel, Wochenplan)'],
 ['Kundenbestellung & Lieferantenabruf',t(v.info.custOrder)&&t(v.info.suppOrder),'Art und Rhythmus des Informationsflusses'],
 ['Steuerung / Schrittmacher',t(v.info.control),'Wo wird der Fluss angestoßen? (z. B. Endmontage)']];
}
function vcomp(v){const c=vchecks(v);return Math.round(c.filter(x=>x[1]).length/c.length*100)}
function liveBar(v){const c=vcalc(v);return `<div class="live"><div><span>Takt</span><b>${fmt(c.takt,1)} s</b></div><div><span>DLZ</span><b>${fmt(c.invDays,1)} AT</b></div><div><span>Flussgrad</span><b>${fmt(c.flow,2)} %</b></div><div><span>Vollständig</span><b>${vcomp(v)} %</b></div></div>`}
function vsmV(p){

 const tabs=`<div class="tabs">${[['daten','Daten'],['karte','Karte'],['kpi','Kennzahlen'],['check','Checkliste']].map(([k,l])=>`<button class="${V.vt===k?'on':''}" onclick="V.vt='${k}';render()">${l}</button>`).join('')}</div>`;
 const body=V.vt==='daten'?vsmData(v):V.vt==='karte'?vsmMap(v,c):V.vt==='kpi'?vsmKpi(p):vsmCheck(v);

}

function addStep(){P().vsm[V.vv].steps.push(newStep());save();render()}
function delStep(i){if(!confirm('Prozessschritt löschen?'))return;P().vsm[V.vv].steps.splice(i,1);save();render()}
function mvStep(i,d){const a=P().vsm[V.vv].steps,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}
function copyIst(){const p=P();const has_=p.vsm.soll.steps.length||p.vsm.soll.customer.demand;if(has_&&!confirm('Soll-Daten durch eine Kopie des Ist ersetzen?'))return;p.vsm.soll=JSON.parse(JSON.stringify(p.vsm.ist));p.vsm.soll.steps.forEach(s=>s.id=uid());save();render();toast('Ist übernommen')}

function factory(x,y,name,sub){return `<path class="fac" d="M${x} ${y+60}V${y+22}l24-14v14l24-14v14l24-14v14h38v46z"/><text x="${x+55}" y="${y+42}" text-anchor="middle" class="b">${esc(trunc(name,16))}</text>${sub?`<text x="${x+55}" y="${y+55}" text-anchor="middle" class="sm">${esc(sub)}</text>`:''}`}
function tri(x,y,inv,days){return `<polygon class="tri" points="${x},${y-17} ${x-15},${y+9} ${x+15},${y+9}"/><text x="${x}" y="${y+5}" text-anchor="middle" class="b">I</text><text x="${x}" y="${y+23}" text-anchor="middle" class="sm">${has(inv)?fmt(num(inv),0)+' Stk':'? Stk'}</text><text x="${x}" y="${y+35}" text-anchor="middle" class="sm">${fmt(days,1)} AT</text>`}
function vsmMap(v,c){
 const n=v.steps.length;if(!n)return '<div class="empty">Lege zuerst unter „Daten“ Prozessschritte an.</div>';
 const BW=128,G=66,X0=120,W=Math.max(660,X0+n*(BW+G)+G+150),H=410,px=i=>X0+G+i*(BW+G),MY=190;
 let s=`<defs>${ARROW}</defs>`;
 s+=factory(10,16,v.supplier.name||'Lieferant',v.supplier.delivery?'':'');
 s+=factory(W-130,16,v.customer.name||'Kunde',has(v.customer.demand)?fmt(c.d,0)+' Stk/Tag':'');
 const ppx=W/2-85;
 s+=`<rect x="${ppx}" y="18" width="170" height="54" rx="4" class="bx"/><text x="${W/2}" y="40" text-anchor="middle" class="b">Produktionsplanung</text><text x="${W/2}" y="57" text-anchor="middle">${esc(trunc(v.info.planning||'–',26))}</text>`;
 s+=`<path d="M${W-130} 44H${ppx+172}" class="info" marker-end="url(#ah)"/><text x="${(W-130+ppx+170)/2}" y="37" text-anchor="middle" class="sm">${esc(trunc(v.info.custOrder,24))}</text>`;
 s+=`<path d="M${ppx} 44H122" class="info" marker-end="url(#ah)"/><text x="${(ppx+120)/2}" y="37" text-anchor="middle" class="sm">${esc(trunc(v.info.suppOrder,24))}</text>`;
 v.steps.forEach((st,i)=>{if(i===0||st.flow==='push')s+=`<path d="M${W/2} 72L${px(i)+BW/2} 162" class="info" marker-end="url(#ah)"/>`});
 s+=`<path d="M65 76V${MY}H${px(0)-G/2-17}" class="mat" marker-end="url(#ah)"/><text x="72" y="104" class="sm">🚚 ${esc(trunc(v.supplier.delivery,14))}</text>`;
 v.steps.forEach((st,i)=>{
  const x=px(i),cs=c.steps[i],tx=x-G/2,lab={push:'PUSH ⇢',fifo:'FIFO',sm:'⟲ Supermarkt'}[st.flow]||'';
  s+=tri(tx,MY,st.inv,cs.days);
  if(i>0)s+=`<path d="M${px(i-1)+BW} ${MY}H${tx-17}" class="mat" marker-end="url(#ah)"/>`;
  s+=`<path d="M${tx+16} ${MY}H${x-2}" class="mat" marker-end="url(#ah)"/>`;
  if(i>0)s+=`<text x="${tx}" y="${MY-26}" text-anchor="middle" class="flow">${lab}</text>`;
  s+=`<rect x="${x}" y="163" width="${BW}" height="36" rx="3" class="bx${cs.over?' bad':''}"/><text x="${x+BW/2}" y="185" text-anchor="middle" class="b">${esc(trunc(st.name||'Schritt '+(i+1),18))}</text>`;
  s+=`<rect x="${x}" y="199" width="${BW}" height="100" class="db"/>`;
  const L=[['ZZ',has(st.ct)?fmt(num(st.ct),1)+' s':'–'],['ZZ eff.',isFinite(cs.eff)?fmt(cs.eff,1)+' s':'–'],['RZ',has(st.co)?fmt(num(st.co),0)+' min':'–'],['Verfügb.',has(st.avail)?fmt(num(st.avail),0)+' %':'–'],['MA / Plätze',(has(st.ops)?fmt(num(st.ops),1):'–')+' / '+(st.par||1)],['Los',has(st.lot)?fmt(num(st.lot),0):'–'],['Ausschuss',has(st.scrap)?fmt(num(st.scrap),1)+' %':'–']];
  L.forEach((r,j)=>{s+=`<text x="${x+6}" y="${214+j*12.5}" class="sm">${r[0]}</text><text x="${x+BW-6}" y="${214+j*12.5}" text-anchor="end">${r[1]}</text>`});
 });
 const lx=px(n-1)+BW,fx=lx+G/2;
 s+=`<path d="M${lx} ${MY}H${fx-17}" class="mat" marker-end="url(#ah)"/>`+tri(fx,MY,v.fg,c.fgDays);
 s+=`<path d="M${fx+16} ${MY}H${W-75}V78" class="mat" marker-end="url(#ah)"/><text x="${W-70}" y="${MY-30}" class="sm">🚚 ${esc(trunc(v.customer.delivery,14))}</text>`;
 const ty=335;let d=`M${px(0)-G} ${ty}`,tl='';
 v.steps.forEach((st,i)=>{const x=px(i),cs=c.steps[i];d+=`H${x}V${ty+26}H${x+BW}V${ty}`;tl+=`<text x="${x-G/2}" y="${ty-6}" text-anchor="middle" class="sm">${fmt(cs.days,1)} AT</text><text x="${x+BW/2}" y="${ty+40}" text-anchor="middle" class="sm">${has(st.ct)?fmt(num(st.ct),1)+' s':'– s'}</text>`});
 d+=`H${lx+G}`;tl+=`<text x="${fx}" y="${ty-6}" text-anchor="middle" class="sm">${fmt(c.fgDays,1)} AT</text>`;
 s+=`<path d="${d}" class="tl"/>${tl}`;
 const sx=lx+G+10;
 s+=`<rect x="${sx}" y="${ty-22}" width="128" height="72" rx="6" class="sum"/><text x="${sx+8}" y="${ty-6}" class="sm">Durchlaufzeit</text><text x="${sx+120}" y="${ty-6}" text-anchor="end" class="b">${fmt(c.invDays,1)} AT</text><text x="${sx+8}" y="${ty+12}" class="sm">Bearbeitungszeit</text><text x="${sx+120}" y="${ty+12}" text-anchor="end" class="b">${fmt(c.bz,0)} s</text><text x="${sx+8}" y="${ty+30}" class="sm">Flussgrad</text><text x="${sx+120}" y="${ty+30}" text-anchor="end" class="b">${fmt(c.flow,2)} %</text>`;
 return `<div class="card scroll"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" class="vsm">${s}</svg></div><p class="mut sm">Seitlich wischen · Rot umrandet = effektive Zykluszeit über Kundentakt · AT = Arbeitstage Reichweite.</p>`;
}
function taktChart(c){
 const st=c.steps.map((s,i)=>({...s,i})).filter(s=>isFinite(s.eff));if(!st.length)return '<div class="empty sm">Zykluszeiten eintragen für das Taktabgleich-Diagramm.</div>';
 const W=360,H=215,L=30,B=182,T=22,mx=Math.max(isFinite(c.takt)?c.takt:0,...st.map(s=>s.eff))*1.15||1,bw=(W-L-10)/st.length,y=v=>B-(v/mx)*(B-T);
 let s='';st.forEach((x,k)=>{const X=L+k*bw+bw*.2,w=bw*.6;s+=`<rect x="${X}" y="${y(x.eff)}" width="${w}" height="${Math.max(0,B-y(x.eff))}" rx="3" class="${x.over?'bbad':'bok'}"/><text x="${X+w/2}" y="${y(x.eff)-4}" text-anchor="middle" class="sm">${fmt(x.eff,0)}</text><text x="${X+w/2}" y="${B+14}" text-anchor="middle" class="sm">${esc(trunc(x.name||'#'+(x.i+1),9))}</text>`});
 s+=`<line x1="${L}" x2="${L}" y1="${T-8}" y2="${B}" class="ax"/><line x1="${L}" x2="${W-6}" y1="${B}" y2="${B}" class="ax"/>`;
 if(isFinite(c.takt))s+=`<line x1="${L}" x2="${W-6}" y1="${y(c.takt)}" y2="${y(c.takt)}" class="takt"/><text x="${W-6}" y="${y(c.takt)-5}" text-anchor="end" class="tk">Takt ${fmt(c.takt,1)} s</text>`;
 return `<svg viewBox="0 0 ${W} ${H}" class="chart" style="width:100%">${s}</svg>`;
}
function vsmKpi(p){

 const tbl=c.steps.length?`<div class="card"><table><tr><th>Schritt</th><th>ZZ eff.</th><th>Auslastung</th><th>Reichweite</th></tr>${c.steps.map((s,i)=>`<tr><td>${esc(trunc(s.name||'Schritt '+(i+1),18))}</td><td class="${s.over?'badc':''}">${fmt(s.eff,1)} s</td><td class="${s.util>100?'badc':''}">${fmt(s.util,0)} %</td><td>${fmt(s.days,1)} AT</td></tr>`).join('')}</table></div>`:'';
 const rows=[['Kundentakt (s)',ci.takt,cs.takt,0,1],['Durchlaufzeit (AT)',ci.invDays,cs.invDays,-1,1],['Bearbeitungszeit (s)',ci.bz,cs.bz,-1,0],['Flussgrad (%)',ci.flow,cs.flow,1,2],['Bestand (Stk)',ci.invPcs,cs.invPcs,-1,0],['Mitarbeiter',ci.ops,cs.ops,-1,1],['Engpass-ZZ (s)',ci.bottleneck?.eff,cs.bottleneck?.eff,-1,1]];
 const cmp=`<h2>Vergleich Ist ↔ Soll</h2><div class="card"><table><tr><th>Kennzahl</th><th>Ist</th><th>Soll</th><th>Δ</th></tr>${rows.map(([l,a,b,dir,dg])=>{const dd=isFinite(a)&&isFinite(b)&&a?(b-a)/a*100:NaN,cls=!isFinite(dd)||dir===0||Math.abs(dd)<.05?'':(dd*dir>0?'good':'badc');return `<tr><td>${l}</td><td>${fmt(a,dg)}</td><td>${fmt(b,dg)}</td><td class="${cls}">${isFinite(dd)?(dd>0?'+':'')+fmt(dd,0)+' %':'–'}</td></tr>`}).join('')}</table></div>`;
 const done=p.actions.filter(a=>a.status==='erledigt').length,ic=vcomp(p.vsm.ist),sc=vcomp(p.vsm.soll);
 const dlzRed=isFinite(ci.invDays)&&ci.invDays>0&&isFinite(cs.invDays)?(1-cs.invDays/ci.invDays)*100:NaN;
 const prog=`<h2>Fortschrittskennzahlen</h2><div class="card">${progRow('Ist-Aufnahme vollständig',ic+' %',ic)}${progRow('Soll-Zustand definiert',sc+' %',sc)}${progRow('Maßnahmen umgesetzt',`${done} / ${p.actions.length}`,pct(done,p.actions.length))}${isFinite(dlzRed)?`<p class="sm" style="margin:8px 0 0">Ziel-Reduktion Durchlaufzeit: <b class="${dlzRed>0?'good':'badc'}">${fmt(dlzRed,0)} %</b></p>`:''}</div>`;
 const hints=[];c.steps.forEach((s,i)=>{if(s.over)hints.push(`<b>${esc(s.name||'Schritt '+(i+1))}</b> liegt mit ${fmt(s.eff,1)} s über dem Takt – Arbeitsinhalt verteilen, Verschwendung abbauen oder parallelisieren.`)});

function newAudit(){const p=P(),a={id:uid(),date:today(),area:p.audits.length?p.audits[p.audits.length-1].area:'',scores:{}};p.audits.push(a);V.aid=a.id;save();render()}
function setScore(k,n){const a=curAudit(P());a.scores[k]=a.scores[k]===n?null:n;save();render()}
function delAudit(){if(!confirm('Audit löschen?'))return;const p=P();p.audits=p.audits.filter(a=>a.id!==V.aid);V.aid=null;save();render()}
const curAudit=p=>p.audits.find(a=>a.id===V.aid)||p.audits[p.audits.length-1];
function radar(vals){const cx=150,cy=128,R=92,n=5,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};let s='';
 [.25,.5,.75,1].forEach(f=>{s+=`<polygon points="${[0,1,2,3,4].map(i=>pt(i,R*f).join(',')).join(' ')}" class="rg"/>`});
 FIVE_S.forEach((x,i)=>{const[X,Y]=pt(i,R),[lx,ly]=pt(i,R+18);s+=`<line x1="${cx}" y1="${cy}" x2="${X}" y2="${Y}" class="rg"/><text x="${lx}" y="${ly+4}" text-anchor="middle">${x[0]} ${fmt(vals[i],0)}%</text>`});
 s+=`<polygon points="${vals.map((v,i)=>pt(i,R*(v||0)/100).join(',')).join(' ')}" class="rv"/>`;return `<svg viewBox="0 0 300 250" class="radar" style="width:100%;max-width:400px;display:block;margin:auto">${s}</svg>`}
function s5V(p){
 if(!p.audits.length)return intro('s5')+`<div class="empty">Noch kein Audit.<br><br><button class="btn pri" onclick="newAudit()">+ Erstes Audit starten</button></div>`+notesBox(p,'s5');
 const a=curAudit(p),i=p.audits.indexOf(a),c=s5calc(a);
 return intro('s5')+`<div class="row gap" style="margin-bottom:10px;overflow-x:auto;flex-wrap:nowrap">${p.audits.map(x=>`<button class="btn sm" style="${x===a?'background:var(--pri);color:#fff;border-color:var(--pri)':''}" onclick="V.aid='${x.id}';render()">${new Date(x.date).toLocaleDateString('de-DE')} · ${fmt(s5calc(x).total,0)}%</button>`).join('')}<button class="btn sm pri" onclick="newAudit()">+ Neu</button></div>
 <div class="card grid2">${fld('Bereich',`audits.${i}.area`,a.area,{ph:'z. B. Vormontage'})}<label class="f"><span>Datum</span><input type="date" value="${esc(a.date)}" onchange="upr('audits.${i}.date',this.value)"></label></div>
 <div class="card">${radar(c.per.map(x=>x.p))}<div style="text-align:center;margin-top:4px"><b style="font-size:22px">${fmt(c.total,0)} %</b> <span class="mut sm">Gesamt · ${c.answered}/20 bewertet</span></div></div>
 ${FIVE_S.map((s,si)=>`<h2>${si+1}. ${s[0]} · ${fmt(c.per[si].p,0)} %</h2><div class="card">${s[1].map((q,qi)=>{const k=si+'-'+qi,v=a.scores[k];return `<div class="q">${q}<div class="score">${[0,1,2,3,4].map(n=>`<button class="${v===n?'on':''}" onclick="setScore('${k}',${n})">${n}</button>`).join('')}<button style="flex:.8" onclick="addAction('5S ${s[0]}: ${q.replace(/'/g,"\\'")}','5S-Audit')">→ M</button></div></div>`}).join('')}</div>`).join('')}
 ${p.audits.length>1?`<h2>Verlauf</h2><div class="card">${p.audits.map(x=>`<div class="prog"><div class="row sm"><span>${new Date(x.date).toLocaleDateString('de-DE')} ${esc(x.area)}</span><b>${fmt(s5calc(x).total,0)} %</b></div>${bar(s5calc(x).total)}</div>`).join('')}</div>`:''}
 <button class="btn del sm" onclick="delAudit()">Dieses Audit löschen</button>`+notesBox(p,'s5');
}

/* ===== Mitarbeitergespräche ===== */
const TALK_KIND={idee:['Idee','#2563eb'],aerger:['Ärgernis/Belastung','#dc2626'],positiv:['Läuft gut','#16a34a']};
const TALK_TOPIC=['Ergonomie','Material','Werkzeug/Vorrichtung','Information','Organisation','Qualität','Arbeitssicherheit','Umgebung','Sonstiges'];
const TALK_ST=['neu','in Prüfung','umgesetzt','abgelehnt'],TALK_CLS={'neu':'neu','in Prüfung':'pruef','umgesetzt':'umgesetzt','abgelehnt':'abgelehnt'};
const TALK_LVL=['1 – kaum','2 – gering','3 – mittel','4 – hoch','5 – sehr hoch'];
const TALK_Q=['Was hält dich bei der Arbeit am meisten auf?','Was ist besonders unangenehm oder nervt dich jeden Tag?','Wo musst du suchen, warten oder unnötig laufen?','Was ist körperlich anstrengend (Heben, Bücken, Strecken, Stehen)?','Wo entstehen Fehler oder Nacharbeit – und warum?','Welche Information fehlt dir oft oder kommt zu spät?','Welches Werkzeug oder Material macht Probleme?','Wenn du einen Tag Chef wärst: Was würdest du sofort ändern?','Was läuft gut und sollte unbedingt so bleiben?'];
const isOpenT=t=>t.status==='neu'||t.status==='in Prüfung';
function addTalk(){const g=id=>document.getElementById(id),text=g('tk_text').value.trim();if(!text){g('tk_text').focus();toast('Bitte das Anliegen beschreiben');return}
 const anon=g('tk_anon').checked,last={date:g('tk_date').value||today(),person:anon?'':g('tk_person').value.trim(),anon,station:g('tk_st').value.trim()};V.tlast=last;
 P().talks.push({id:uid(),...last,kind:g('tk_kind').value,topic:g('tk_topic').value,text,quote:g('tk_quote').value.trim(),level:+g('tk_lvl').value||3,status:'neu',feedback:false,fbDate:'',created:Date.now()});save();render();toast('Anliegen dokumentiert')}
const talkById=id=>P().talks.find(x=>x.id===id);
function talkSt(id){const t=talkById(id);t.status=TALK_ST[(TALK_ST.indexOf(t.status)+1)%TALK_ST.length];save();render()}
function talkFb(id){const t=talkById(id);t.feedback=!t.feedback;t.fbDate=t.feedback?today():'';save();render()}
function talkAct(id){const t=talkById(id);addAction(`${TALK_KIND[t.kind][0]}: ${t.text}${t.station?' ('+t.station+')':''}`,'Mitarbeitergespräch');if(t.status==='neu')t.status='in Prüfung';save();render()}
function delTalk(id){if(!confirm('Eintrag löschen?'))return;const p=P();p.talks=p.talks.filter(t=>t.id!==id);save();render()}
function talkV(p){
 const ts=p.talks,L=V.tlast||{date:today(),person:'',anon:false,station:''},tf=V.tf||'offen';
 const concerns=ts.filter(t=>t.kind!=='positiv'),open=ts.filter(isOpenT).length,fb=concerns.filter(t=>t.feedback).length,done=concerns.filter(t=>t.status==='umgesetzt').length;
 const kpi=(l,v,u,h)=>`<div class="kpi"><span>${l}</span><b>${v}<small> ${u}</small></b>${h?`<i>${h}</i>`:''}</div>`;
 const byT=TALK_TOPIC.map(tp=>{const c={idee:0,aerger:0,positiv:0};ts.forEach(t=>{if(t.topic===tp)c[t.kind]++});return[tp,c,c.idee+c.aerger+c.positiv]}).filter(x=>x[2]).sort((a,b)=>b[2]-a[2]),mx=Math.max(1,...byT.map(x=>x[2]));
 const top=ts.filter(t=>t.kind==='aerger'&&isOpenT(t)).sort((a,b)=>b.level-a.level||b.created-a.created).slice(0,3);
 let list=ts.slice();if(tf==='offen')list=list.filter(isOpenT);if(tf==='aerger'||tf==='idee')list=list.filter(t=>t.kind===tf);if(tf==='fb')list=list.filter(t=>t.kind!=='positiv'&&!t.feedback);
 list.sort((a,b)=>(isOpenT(b)-isOpenT(a))||b.level-a.level||b.created-a.created);
 const card=t=>{const i=p.talks.indexOf(t),k=TALK_KIND[t.kind]||TALK_KIND.idee,q=`talks.${i}`;return `<div class="card"><div class="row"><span><span class="chip c" style="background:${k[1]}">${k[0]}</span> <span class="chip">${esc(t.topic)}</span></span><button class="st ${TALK_CLS[t.status]}" onclick="talkSt('${t.id}')">${t.status}</button></div>
  <div style="margin:8px 0 4px">${esc(t.text)}</div>${t.quote?`<div class="quote">„${esc(t.quote)}“</div>`:''}
  <div class="mut sm">${new Date(t.date).toLocaleDateString('de-DE')} · ${t.anon?'anonym':esc(t.person)||'ohne Namen'}${t.station?' · '+esc(t.station):''}${t.kind!=='positiv'?` · Belastung <span class="lvl">${'●'.repeat(t.level)}${'○'.repeat(5-t.level)}</span>`:''}</div>
  <div class="row gap" style="margin-top:8px">${t.kind!=='positiv'?`<button class="btn sm${t.feedback?' on':''}" onclick="talkFb('${t.id}')">${t.feedback?'✓ Rückmeldung '+new Date(t.fbDate).toLocaleDateString('de-DE'):'Rückmeldung offen'}</button><button class="btn sm" onclick="talkAct('${t.id}')">→ Maßnahme</button>`:''}<span style="flex:1"></span><button class="ib" onclick="delTalk('${t.id}')">✕</button></div>
  <details style="margin-top:6px"><summary class="sm mut">Bearbeiten</summary><div class="grid2" style="margin-top:8px">
  ${area('Anliegen',q+'.text',t.text,'',2).replace('<label class="f">','<label class="f full">')}${fld('Zitat',q+'.quote',t.quote,{cls:'full'})}
  <label class="f"><span>Art</span><select onchange="upr('${q}.kind',this.value)">${Object.entries(TALK_KIND).map(([v,x])=>opt(v,x[0],t.kind)).join('')}</select></label>
  <label class="f"><span>Thema</span><select onchange="upr('${q}.topic',this.value)">${TALK_TOPIC.map(x=>opt(x,x,t.topic)).join('')}</select></label>
  <label class="f"><span>Belastung</span><select onchange="upr('${q}.level',+this.value)">${TALK_LVL.map((x,j)=>opt(String(j+1),x,String(t.level))).join('')}</select></label>
  ${fld('Station',q+'.station',t.station)}${t.anon?'':fld('Mitarbeiter',q+'.person',t.person)}</div></details></div>`};
 return intro('talk')+`<details class="card"><summary>💡 Leitfragen fürs Gespräch</summary><ol class="sm" style="padding-left:20px;margin:8px 0 0">${TALK_Q.map(x=>`<li style="margin-bottom:4px">${x}</li>`).join('')}</ol></details>
 <h2>Anliegen erfassen</h2><div class="card"><div class="grid2">
 <label class="f"><span>Datum</span><input id="tk_date" type="date" value="${esc(L.date)}"></label><label class="f"><span>Station</span><input id="tk_st" value="${esc(L.station)}" placeholder="z. B. Endmontage 2"></label>
 <label class="f"><span>Mitarbeiter</span><input id="tk_person" value="${esc(L.person)}" placeholder="Name oder Kürzel"${L.anon?' disabled':''}></label>
 <label class="f" style="display:flex;align-items:flex-end;gap:8px;padding-bottom:9px"><input id="tk_anon" type="checkbox" style="width:auto"${L.anon?' checked':''} onchange="document.getElementById('tk_person').disabled=this.checked"> anonym</label>
 <label class="f"><span>Art</span><select id="tk_kind">${Object.entries(TALK_KIND).map(([v,x])=>opt(v,x[0],'aerger')).join('')}</select></label>
 <label class="f"><span>Thema</span><select id="tk_topic">${TALK_TOPIC.map(x=>opt(x,x,'')).join('')}</select></label>
 <label class="f full"><span>Anliegen</span><textarea id="tk_text" rows="3" placeholder="Was genau ist das Problem bzw. die Idee?"></textarea></label>
 <label class="f full"><span>Zitat <i>(optional)</i></span><input id="tk_quote" placeholder="Wörtlich, was der Mitarbeiter gesagt hat"></label>
 <label class="f full"><span>Belastung / Dringlichkeit</span><select id="tk_lvl">${TALK_LVL.map((x,j)=>opt(String(j+1),x,'3')).join('')}</select></label></div>
 <button class="btn pri wide" onclick="addTalk()">+ Anliegen speichern</button><p class="mut sm" style="margin:6px 0 0">Datum, Station und Mitarbeiter bleiben für das nächste Anliegen aus demselben Gespräch stehen.</p></div>
 <h2>Auswertung</h2><div class="kpis">${kpi('Anliegen',ts.length,'',`${concerns.length} Ideen/Ärgernisse`)}${kpi('Offen',open,'','neu oder in Prüfung')}${kpi('Rückmeldequote',fmt(pct(fb,concerns.length),0),'%',`${fb} von ${concerns.length}`)}${kpi('Umgesetzt',fmt(pct(done,concerns.length),0),'%',`${done} von ${concerns.length}`)}</div>
 ${byT.length?`<div class="card" style="margin-top:8px"><div class="sm mut" style="margin-bottom:4px">Nach Thema · <span style="color:#dc2626">■</span> Ärgernis <span style="color:#2563eb">■</span> Idee <span style="color:#16a34a">■</span> Läuft gut</div>${byT.map(([tp,c,n])=>`<div class="prog"><div class="row sm"><span>${tp}</span><b>${n}</b></div><div class="stack" style="width:${n/mx*100}%;margin:2px 0;height:12px">${['aerger','idee','positiv'].map(k=>c[k]?`<i style="width:${pct(c[k],n)}%;background:${TALK_KIND[k][1]}"></i>`:'').join('')}</div></div>`).join('')}</div>`:''}
 ${top.length?`<h2>Größte offene Ärgernisse</h2>${top.map(card).join('')}`:''}
 <h2>Alle Anliegen</h2><div class="seg">${[['offen','Offen'],['fb','Rückm. offen'],['aerger','Ärgernisse'],['idee','Ideen'],['alle','Alle']].map(([k,l])=>`<button class="${tf===k?'on':''}" onclick="V.tf='${k}';render()">${l}</button>`).join('')}</div>
 ${list.map(card).join('')||'<div class="empty">Keine Einträge in dieser Ansicht.</div>'}`+notesBox(p,'talk');
}

const R={talk:talkV,vsm:vsmV,muda:mudaV,time:timeV,spag:spagV,greif:greifV,ishi:ishiV,why:whyV,s5:s5V,act:actV,notes:notesV};
storeTest();persist();load();if(S.last&&S.projects.some(p=>p.id===S.last)){V.pid=S.last;V.view='project'}render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
